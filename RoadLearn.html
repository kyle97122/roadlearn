                <div>
                  <div style={{fontSize:13, fontWeight:700, color:dark?'#fafafa':'#0f172a'}}>{googleUser.name}</div>
                  <div style={{fontSize:11, color:dark?'#52525b':'#94a3b8'}}>{googleUser.email}</div>
                </div>
              </div>
              <button onClick={googleSignOut} style={{fontSize:12, color:'#ef4444', background:'none', border:'none', cursor:'pointer', fontWeight:700}}>{(L_GOOGLE[lang]||L_GOOGLE.fr).signOut}</button>
            </div>
          ) : (
            <button onClick={googleSignIn} style={{width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:9, background:'white', border:'1.5px solid #e8eaf0', borderRadius:12, padding:'10px 14px', fontSize:13, fontWeight:600, cursor:'pointer', color:'#374151', boxShadow:'0 1px 4px rgba(0,0,0,0.07)'}}>
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              {(L_GOOGLE[lang]||L_GOOGLE.fr).signIn}
            </button>
          )}
        </div>

        <div style={{textAlign:'center',fontSize:12,color:dark?'#3f3f46':'#94a3b8',paddingBottom:24}}>RoadLearn · {t.settings.version} 2.0 · 🏅 {state.bestStreak||1}</div>
      </div>
      <BottomNav active="profile"/>
    </PhoneFrame>
  );

  // ── Niveaux ───────────────────────────────────────────────────────────────
  if (screen === "levels") {
    const activeRM = tRoadmaps || ROADMAPS;
    const rm = activeRM.find(r => r.id === curRM);
    if (!rm) return null;
    let total = 0; rm.sections.forEach(s => total += s.levels.length);
    const done = (state.done[rm.id]||[]).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const progColors = {frontend:'#3b82f6',backend:'#10b981',devops:'#f59e0b',ai:'#8b5cf6',fullstack:'#ec4899',sql:'#78716c'};
    const prog = progColors[rm.id] || '#3b82f6';
    return (
      <PhoneFrame>
        {/* Header */}
        <div style={{padding:'12px 16px 12px', flexShrink:0}}>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
            <button onClick={()=>navTo("home")} style={{padding:'6px', borderRadius:10, background: dark?'#161616':'#f3f4f6', border:'none', cursor:'pointer', color: dark?'#d1d5db':'#374151'}}><ArrowLeft size={18}/></button>
            <div style={{fontSize:16, fontWeight:700, flex:1, color: dark?'#f9fafb':'#111827'}}>{rm.icon} {rm.name}</div>
            <div style={{display:'flex', alignItems:'center', gap:4, background: dark?'#1e3a5f':'#eff6ff', color: dark?'#60a5fa':'#1d4ed8', borderRadius:99, padding:'4px 10px', fontSize:11, fontWeight:600}}>
              <Zap size={11}/><span>{state.xp} XP</span>
            </div>
          </div>
          <div style={{height:5, background: dark?'#2a2a2a':'#f3f4f6', borderRadius:99, overflow:'hidden'}}>
            <div className="progress-bar" style={{height:'100%', borderRadius:99, background:prog, width:`${pct}%`}}/>
          </div>
          <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', marginTop:4, fontWeight:500}}>{done}/{total} {(L_LESSON[lang]||L_LESSON.fr).levelsCompleted}</div>
        </div>

        <div style={{flex:1, overflowY:'auto', padding:'0 16px 16px'}}>
          {rm.sections.map((sec,si)=>(
            <div key={si} style={{marginBottom:16}}>
              <div style={{
                fontSize:10, fontWeight:800, color: dark?'#6b7280':'#9ca3af',
                letterSpacing:'0.1em', marginBottom:8, marginTop:si>0?16:4,
                display:'flex', alignItems:'center', gap:8
              }}>
                <span>{sec.title}</span>
                <div style={{flex:1, height:1, background: dark?'#2a2a2a':'#f3f4f6'}}/>
              </div>
              {sec.levels.map((lv,li)=>{
                const fi = getLevelIdx(curRM,si,li);
                const done = isDone(curRM,si,li);
                const unlocked = isUnlocked(curRM,si,li);
                const clickable = done || unlocked;
                const isCur = !done && unlocked;
                const ll = L_LESSON[lang]||L_LESSON.fr;
                const typeLabel = lv.type.includes("code")?ll.typeCode:lv.type.includes("theory")?ll.typeTheory:ll.typeQuiz;
                const typeIcon = lv.type.includes("code")?"💻":lv.type.includes("challenge")?"🎯":"📝";
                return (
                  <React.Fragment key={li}>
                    <button onClick={()=>clickable&&startLesson(curRM,si,li)} disabled={!clickable}
                      className={clickable?"card-hover":""}
                      style={{
                        width:'100%', display:'flex', alignItems:'center', gap:12,
                        padding:'11px 12px', borderRadius:14, border:`1.5px solid`,
                        textAlign:'left', marginBottom:4, cursor: clickable?'pointer':'default',
                        background: done?(dark?'#064e3b':'#f0fdf4'):isCur?(dark?'#1e3a5f':'#eff6ff'):(dark?'#161616':'#ffffff'),
                        borderColor: done?(dark?'#059669':'#6ee7b7'):isCur?(dark?'#3b82f6':'#93c5fd'):(dark?'#2a2a2a':'#f3f4f6'),
                        opacity: !clickable?0.5:1,
                        boxShadow: isCur?(dark?'0 0 0 1px #3b82f6':'0 0 0 1px #93c5fd, 0 4px 12px rgba(59,130,246,0.1)'):'none'
                      }}>
                      <div style={{
                        width:36, height:36, borderRadius:'50%', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        background: done?(dark?'#059669':'#10b981'):isCur?(dark?'#1d4ed8':'#3b82f6'):(dark?'#2a2a2a':'#e5e7eb'),
                        color:'white', fontSize:12, fontWeight:700
                      }}>
                        {done?<Check size={15}/>:unlocked?<span>{fi+1}</span>:<Lock size={13}/>}
                      </div>
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:13, fontWeight:600, color: dark?'#f9fafb':'#111827', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginBottom:2}}>{lv.name}</div>
                        <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af'}}>
                          {typeIcon} {typeLabel} · {lv.xp} XP{done&&<span style={{color: dark?'#34d399':'#059669', marginLeft:4}}>· {ll.replayLabel}</span>}
                        </div>
                      </div>
                      <div style={{fontSize:11, fontWeight:700, flexShrink:0, color: done?(dark?'#34d399':'#059669'):(dark?'#60a5fa':'#1d4ed8')}}>
                        {done?<RefreshCw size={14}/>:`+${lv.xp} XP`}
                      </div>
                    </button>
                    {li<sec.levels.length-1&&<div style={{width:2, height:6, marginLeft:29, borderRadius:99, background: done?(dark?'#059669':'#6ee7b7'):(dark?'#2a2a2a':'#e5e7eb'), marginBottom:4}}/>}
                  </React.Fragment>
                );
              })}
            </div>
          ))}
        </div>
      </PhoneFrame>
    );
  }

  // ── Leçon ─────────────────────────────────────────────────────────────────
  if (screen === "lesson") {
    const activeSteps = tSteps || steps;
    const total = activeSteps.length || 7;
    const pct = Math.round((stepIdx/total)*100);
    const step = activeSteps[stepIdx];
    const letters = ["A","B","C","D"];
    return (
      <PhoneFrame>
        {/* Barre de progression leçon */}
        <div style={{padding:'12px 16px 12px', borderBottom:`1px solid ${dark?'#161616':'#f3f4f6'}`, flexShrink:0}}>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
            <button onClick={()=>setScreen("levels")} style={{padding:6, borderRadius:10, background: dark?'#161616':'#f3f4f6', border:'none', cursor:'pointer', color: dark?'#d1d5db':'#6b7280'}}><X size={16}/></button>
            <div style={{flex:1, height:8, background: dark?'#161616':'#f3f4f6', borderRadius:99, overflow:'hidden'}}>
              <div className="progress-bar" style={{height:'100%', borderRadius:99, background:'linear-gradient(90deg,#3b82f6,#6366f1)', width:`${pct}%`}}/>
            </div>
            <div style={{display:'flex', gap:3}}>
              {[1,2,3].map(i=>(
                <span key={i} style={{fontSize:16, filter: i>lives?'grayscale(1) opacity(0.3)':'none', transition:'filter 0.3s'}}>❤️</span>
              ))}
            </div>
          </div>
          <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', fontWeight:500, display:'flex', alignItems:'center', gap:6}}>
            {(()=>{const ll=L_LESSON[lang]||L_LESSON.fr;return loading?ll.loading:step?.type==="theory"?`📖 ${ll.lesson} ${stepIdx+1}/${total}`:`❓ ${ll.question} ${stepIdx+1}/${total}`;})()}
            {translating && <span style={{fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:99,background:dark?'#1e3a5f':'#eff6ff',color:dark?'#60a5fa':'#1d4ed8',animation:'pulse 1.2s ease-in-out infinite'}}>🌐 …</span>}
          </div>
        </div>

        <div style={{flex:1, overflowY:'auto', padding:'16px'}}>
          {/* Chargement */}
          {loading && (
            <div style={{textAlign:'center', padding:'48px 0'}}>
              <Loader2 className="animate-spin" size={32} style={{color:'#3b82f6', margin:'0 auto 12px'}}/>
              <div style={{fontSize:14, color: dark?'#9ca3af':'#6b7280', fontWeight:500}}>{(L_LESSON[lang]||L_LESSON.fr).preparing}</div>
              <div style={{fontSize:12, color: dark?'#4b5563':'#9ca3af', marginTop:4}}>{(L_LESSON[lang]||L_LESSON.fr).instant}</div>
            </div>
          )}

          {/* Erreur */}
          {error && (
            <div style={{textAlign:'center', padding:'48px 0'}}>
              <AlertCircle size={32} style={{color:'#ef4444', margin:'0 auto 12px'}}/>
              <div style={{fontSize:14, fontWeight:600, color: dark?'#f9fafb':'#111827', marginBottom:4}}>{(L_LESSON[lang]||L_LESSON.fr).error}</div>
              <div style={{fontSize:12, color: dark?'#9ca3af':'#6b7280', marginBottom:16, padding:'0 16px'}}>{error}</div>
              <button onClick={()=>startLesson(curRM,curSecIdx,curLvlIdx)} style={{background:'#3b82f6', color:'white', borderRadius:12, padding:'10px 24px', fontSize:13, fontWeight:600, border:'none', cursor:'pointer', marginBottom:8, display:'block', margin:'0 auto 8px'}}>{(L_LESSON[lang]||L_LESSON.fr).retry}</button>
              <button onClick={()=>setScreen("levels")} style={{background:'none', border:'none', cursor:'pointer', color: dark?'#6b7280':'#9ca3af', fontSize:13}}>{(L_LESSON[lang]||L_LESSON.fr).back}</button>
            </div>
          )}

          {/* Théorie */}
          {!loading&&!error&&step&&step.type==="theory"&&(
            <div className="fade-in">
              {/* Header théorie + TTS */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:8,background:dark?'#1e3a5f':'#eff6ff',color:dark?'#60a5fa':'#1d4ed8'}}>
                  <BookOpen size={12}/>{(L_LESSON[lang]||L_LESSON.fr).theory}
                </div>
                <button onClick={()=>speakText(step.content)}
                  style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:20,border:'none',cursor:'pointer',fontSize:12,fontWeight:600,
                    background:ttsPlaying?'#3b82f6':(dark?'#161616':'#f0f0f0'),
                    color:ttsPlaying?'#fff':(dark?'#9ca3af':'#6b7280')}}>
                  <span style={{fontSize:15}}>{ttsPlaying?'⏸':'🔊'}</span>
                  {ttsPlaying?t.tts.stop:t.tts.listen}
                </button>
              </div>
              {/* Contrôle vitesse TTS */}
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                <Volume2 size={13} style={{color:dark?'#6b7280':'#9ca3af',flexShrink:0}}/>
                <span style={{fontSize:11,color:dark?'#6b7280':'#9ca3af',fontWeight:500,marginRight:4}}>{(L_LESSON[lang]||L_LESSON.fr).speed}</span>
                {[{v:0.65,l:'0.75×'},{v:0.9,l:'1×'},{v:1.15,l:'1.25×'},{v:1.4,l:'1.5×'}].map(({v,l})=>(
                  <button key={v} onClick={()=>changeTtsSpeed(v)}
                    style={{padding:'3px 9px',borderRadius:8,fontSize:11,fontWeight:600,cursor:'pointer',border:`1.5px solid ${ttsSpeed===v?(dark?'#3b82f6':'#3b82f6'):(dark?'#2a2a2a':'#e5e7eb')}`,
                      background:ttsSpeed===v?'#3b82f6':(dark?'#161616':'white'),
                      color:ttsSpeed===v?'white':(dark?'#9ca3af':'#6b7280')}}>
                    {l}
                  </button>
                ))}
              </div>
              <div style={{background:dark?'#161616':'#f8faff',border:`1px solid ${dark?'#2a2a2a':'#dbeafe'}`,borderLeft:'4px solid #3b82f6',borderRadius:'0 14px 14px 0',padding:'14px 16px',fontSize:14,color:dark?'#d1d5db':'#374151',lineHeight:1.75,marginBottom:20}}>
                {step.content}
              </div>
              <button onClick={nextStep} style={{width:'100%',background:'linear-gradient(135deg,#3b82f6,#6366f1)',color:'white',borderRadius:14,padding:'14px',fontSize:15,fontWeight:600,border:'none',cursor:'pointer',boxShadow:'0 6px 20px rgba(99,102,241,0.3)'}}>{(L_LESSON[lang]||L_LESSON.fr).understood}</button>
            </div>
          )}

          {/* Quiz */}
          {!loading&&!error&&step&&step.type!=="theory"&&(
            <div className="fade-in">
              {/* Rappel de cours */}
              {activeSteps[0]?.content && (
                <div style={{marginBottom:14}}>
                  <button onClick={()=>setShowTheory(!showTheory)}
                    style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderRadius:12,border:`1px solid ${dark?'#2a2a2a':'#e5e7eb'}`,background:dark?'#161616':'#f9fafb',cursor:'pointer',fontSize:12,fontWeight:600,color:dark?'#9ca3af':'#6b7280'}}>
                    <span>📖 {t.tts.tip}</span>
                    <span style={{transition:'transform 0.2s',display:'inline-block',transform:showTheory?'rotate(180deg)':'rotate(0deg)'}}>▼</span>
                  </button>
                  {showTheory&&(
                    <div style={{marginTop:6,borderLeft:'4px solid #3b82f6',borderRadius:'0 12px 12px 0',padding:'10px 14px',background:dark?'#161616':'#f8faff',color:dark?'#d1d5db':'#374151',fontSize:13,lineHeight:1.65}}>
                      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:8}}>
                        <button onClick={()=>speakText(activeSteps[0].content)}
                          style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:16,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,
                            background:ttsPlaying?'#3b82f6':(dark?'#2a2a2a':'#e5e7eb'),color:ttsPlaying?'#fff':(dark?'#9ca3af':'#6b7280')}}>
                          <span>{ttsPlaying?'⏸':'🔊'}</span>{ttsPlaying?t.tts.stop:t.tts.listen}
                        </button>
                      </div>
                      {activeSteps[0].content}
                    </div>
                  )}
                </div>
              )}
              {/* Badge type */}
              <div style={{display:'inline-flex', alignItems:'center', gap:5, fontSize:11, fontWeight:700, padding:'4px 10px', borderRadius:8, marginBottom:14,
                ...(step.type==="code"
                  ? {background: dark?'#2e1065':'#f3e8ff', color: dark?'#c084fc':'#7c3aed'}
                  : step.type==="challenge"
                  ? {background: dark?'#431407':'#fff7ed', color: dark?'#fb923c':'#c2410c'}
                  : {background: dark?'#064e3b':'#f0fdf4', color: dark?'#34d399':'#059669'})
              }}>
                {step.type==="code"?<><Code2 size={12}/>CODE</>:step.type==="challenge"?<><Target size={12}/>DÉFI</>:<><Sparkles size={12}/>QUIZ</>}
              </div>

              {/* Question */}
              <div style={{fontSize:15, fontWeight:600, lineHeight:1.6, marginBottom:16, color: dark?'#f9fafb':'#111827'}}>
                {step.q}
              </div>

              {/* Code snippet */}
              {step.snippet && (
                <pre style={{background:'#0f172a', color:'#86efac', borderRadius:12, padding:'12px 14px', fontSize:12, fontFamily:'monospace', marginBottom:16, overflowX:'auto', border:'1px solid #1e293b'}}>{step.snippet}</pre>
              )}

              {/* Réponses */}
              <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:16}}>
                {(step.answers||[]).map((a,i)=>{
                  const isSelected=selectedAns===i, isCorrect=i===step.correct;
                  let bg, border, textColor, letterBg, letterColor;
                  if (!answered) {
                    bg = dark?'#161616':'#f9fafb'; border = dark?'#2a2a2a':'#e5e7eb';
                    textColor = dark?'#d1d5db':'#374151'; letterBg = dark?'#2a2a2a':'#e5e7eb'; letterColor = dark?'#9ca3af':'#6b7280';
                  } else if (isCorrect) {
                    bg = dark?'#064e3b':'#f0fdf4'; border = dark?'#059669':'#6ee7b7';
                    textColor = dark?'#a7f3d0':'#065f46'; letterBg = '#10b981'; letterColor = 'white';
                  } else if (isSelected) {
                    bg = dark?'#450a0a':'#fff1f2'; border = dark?'#b91c1c':'#fca5a5';
                    textColor = dark?'#fca5a5':'#9f1239'; letterBg = '#ef4444'; letterColor = 'white';
                  } else {
                    bg = dark?'#161616':'#f9fafb'; border = dark?'#2a2a2a':'#e5e7eb';
                    textColor = dark?'#6b7280':'#9ca3af'; letterBg = dark?'#2a2a2a':'#e5e7eb'; letterColor = dark?'#6b7280':'#9ca3af';
                  }
                  return (
                    <button key={i} onClick={()=>handleAnswer(i)} disabled={answered}
                      className={!answered?"card-hover":""}
                      style={{
                        width:'100%', textAlign:'left', padding:'12px 14px',
                        border:`1.5px solid ${border}`, borderRadius:14,
                        fontSize:13, display:'flex', alignItems:'center', gap:10,
                        background: bg, color: textColor, cursor: answered?'default':'pointer',
                        transition:'all 0.2s'
                      }}>
                      <span style={{
                        width:26, height:26, borderRadius:'50%', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:11, fontWeight:700,
                        background: letterBg, color: letterColor,
                        transition:'all 0.2s'
                      }}>{letters[i]}</span>
                      <span style={{flex:1, lineHeight:1.5}}>{a}</span>
                    </button>
                  );
                })}
              </div>

              {/* Explication */}
              {answered && (
                <div className="slide-up">
                  <div style={{
                    borderRadius:14, padding:'12px 14px', marginBottom:12, fontSize:13, lineHeight:1.6,
                    ...(selectedAns===step.correct
                      ? {background: dark?'#064e3b':'#f0fdf4', border:`1.5px solid ${dark?'#059669':'#6ee7b7'}`, color: dark?'#a7f3d0':'#065f46'}
                      : {background: dark?'#450a0a':'#fff1f2', border:`1.5px solid ${dark?'#b91c1c':'#fca5a5'}`, color: dark?'#fca5a5':'#9f1239'})
                  }}>
                    <div style={{fontWeight:700, fontSize:14, marginBottom:5}}>
                      {selectedAns===step.correct?(L_LESSON[lang]||L_LESSON.fr).correct:(L_LESSON[lang]||L_LESSON.fr).wrong}
                    </div>
                    {step.explanation}
                  </div>
                  <button onClick={nextStep} style={{
                    width:'100%', borderRadius:14, padding:'14px', fontSize:15,
                    fontWeight:600, border:'none', cursor:'pointer', color:'white',
                    background: lives===0?'linear-gradient(135deg,#ef4444,#b91c1c)':'linear-gradient(135deg,#3b82f6,#6366f1)',
                    boxShadow: lives===0?'0 6px 20px rgba(239,68,68,0.3)':'0 6px 20px rgba(99,102,241,0.3)'
                  }}>
                    {lives===0?(L_LESSON[lang]||L_LESSON.fr).seeResult:stepIdx+1>=steps.length?(L_LESSON[lang]||L_LESSON.fr).finish:(L_LESSON[lang]||L_LESSON.fr).cont}
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      </PhoneFrame>
    );
  }

  // ── Résultat ──────────────────────────────────────────────────────────────
  if (screen === "result") {
    const r = resultData;
    if (!r) return null;
    const lr = L_RESULT[lang]||L_RESULT.fr;
    const resultEmoji = r.failed ? "💔" : r.perfect ? "🏆" : "⭐";
    const resultTitle = r.failed ? lr.failTitle : r.perfect ? lr.perfectTitle : lr.doneTitle;
    const resultSub   = r.failed ? lr.failSub   : r.perfect ? lr.perfectSub   : lr.doneSub;
    const xpBg    = r.failed ? (dark?'#450a0a':'#fff1f2') : r.perfect ? (dark?'#064e3b':'#f0fdf4') : (dark?'#1e3a5f':'#eff6ff');
    const xpColor = r.failed ? (dark?'#fca5a5':'#be185d') : r.perfect ? (dark?'#34d399':'#059669') : (dark?'#60a5fa':'#1d4ed8');
    const xpBorder= r.failed ? (dark?'#b91c1c':'#fecdd3') : r.perfect ? (dark?'#059669':'#6ee7b7') : (dark?'#1e40af':'#bfdbfe');
    const letters = ["A","B","C","D"];

    function handleShare() {
      const medal = r.perfect ? '🏆' : r.failed ? '💪' : '⭐';
      const text = `${medal} RoadLearn — "${r.levelName}"\n✅ ${r.score}/${r.total} · 🎯 ${r.acc}% · ⚡ +${r.xpGain} XP\n\n📱 ${lr.tryApp||'Essaie RoadLearn !'}`;
      if (navigator.share) {
        navigator.share({ title:'RoadLearn', text }).catch(()=>{});
      } else {
        navigator.clipboard?.writeText(text).then(()=>alert(lr.copied||'Résultat copié ! 📋')).catch(()=>{});
      }
    }

    return (
      <PhoneFrame>
        {confetti && <ConfettiOverlay/>}
        <div style={{flex:1, overflowY:'auto', padding:'20px 20px 24px', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center'}}>
          {/* Emoji animé */}
          <div className="bounce-in" style={{fontSize:72, marginBottom:12, lineHeight:1, marginTop:8}}>{resultEmoji}</div>
          <div style={{fontSize:22, fontWeight:700, marginBottom:6, color: dark?'#f9fafb':'#111827'}}>{resultTitle}</div>
          <div style={{fontSize:13, color: dark?'#9ca3af':'#6b7280', marginBottom:20}}>{r.total} questions · {resultSub}</div>

          {/* XP Card */}
          <div className="slide-up" style={{background:xpBg, border:`1.5px solid ${xpBorder}`, borderRadius:20, padding:'16px 32px', marginBottom:16, width:'100%'}}>
            <div style={{fontSize:42, fontWeight:800, color:xpColor}}>+{r.xpGain}</div>
            <div style={{fontSize:13, color:xpColor, fontWeight:600, opacity:0.8}}>{lr.xpGained}</div>
          </div>

          {/* Stats */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:16, width:'100%'}}>
            {[{v:`${r.score}/${r.total}`,l:lr.correct,icon:'✅'},{v:`${r.acc}%`,l:lr.accuracy,icon:'🎯'},{v:`${r.livesLeft}/3`,l:lr.lives,icon:'❤️'}].map((s,i)=>(
              <div key={i} style={{background:dark?'#161616':'#f9fafb', border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`, borderRadius:14, padding:'10px 6px', textAlign:'center'}}>
                <div style={{fontSize:18, marginBottom:4}}>{s.icon}</div>
                <div style={{fontSize:16, fontWeight:700, color:dark?'#f9fafb':'#111827'}}>{s.v}</div>
                <div style={{fontSize:11, color:dark?'#6b7280':'#9ca3af', marginTop:2}}>{s.l}</div>
              </div>
            ))}
          </div>

          {/* ── Mastery Gate : suggestion de rejouer si score < 70% ── */}
          {r.masteryWarn && (
            <div className="slide-up" style={{width:'100%', marginBottom:14, padding:'12px 14px', borderRadius:14,
              background:dark?'#451a03':'#fff7ed', border:`1.5px solid ${dark?'#92400e':'#fcd34d'}`, textAlign:'left'}}>
              <div style={{fontSize:13, fontWeight:700, color:dark?'#fbbf24':'#b45309', marginBottom:4}}>⚠️ {lr.lowScore} ({r.acc}%)</div>
              <div style={{fontSize:12, color:dark?'#d97706':'#92400e', lineHeight:1.5}}>
                {lr.lowScoreText}
              </div>
            </div>
          )}

          {/* ── Revoir les erreurs ── */}
          {r.wrongAnswers && r.wrongAnswers.length > 0 && (
            <div style={{width:'100%', marginBottom:14}}>
              <button onClick={()=>setShowErrorReview(v=>!v)}
                style={{width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
                  padding:'11px 14px', borderRadius:14, cursor:'pointer',
                  background:dark?'#161616':'#f9fafb', border:`1px solid ${dark?'#2a2a2a':'#e5e7eb'}`,
                  fontSize:13, fontWeight:600, color:dark?'#d1d5db':'#374151'}}>
                <span>❌ {r.wrongAnswers.length} {lr.errorsReview}</span>
                <span style={{fontSize:12, transition:'transform 0.2s', display:'inline-block', transform:showErrorReview?'rotate(180deg)':'none'}}>▼</span>
              </button>
              {showErrorReview && (
                <div className="slide-up" style={{marginTop:8, display:'flex', flexDirection:'column', gap:10}}>
                  {r.wrongAnswers.map((w,wi) => (
                    <div key={wi} style={{borderRadius:14, padding:'12px 14px', textAlign:'left',
                      background:dark?'#161616':'#f9fafb', border:`1.5px solid ${dark?'#2a2a2a':'#e5e7eb'}`}}>
                      <div style={{fontSize:13, fontWeight:600, color:dark?'#f9fafb':'#111827', marginBottom:8}}>{w.q}</div>
                      <div style={{display:'flex', flexDirection:'column', gap:5}}>
                        {(w.answers||[]).map((a,ai) => (
                          <div key={ai} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 10px', borderRadius:10, fontSize:12,
                            background: ai===w.correct?(dark?'#064e3b':'#f0fdf4'):ai===w.chosen?(dark?'#450a0a':'#fff1f2'):'transparent',
                            border:`1px solid ${ai===w.correct?(dark?'#059669':'#6ee7b7'):ai===w.chosen?(dark?'#b91c1c':'#fca5a5'):'transparent'}`,
                            color: ai===w.correct?(dark?'#a7f3d0':'#065f46'):ai===w.chosen?(dark?'#fca5a5':'#9f1239'):(dark?'#9ca3af':'#6b7280')}}>
                            <span style={{flexShrink:0}}>{ai===w.correct?'✅':ai===w.chosen?'❌':'○'}</span>
                            <span>{letters[ai]} · {a}</span>
                          </div>
                        ))}
                      </div>
                      {w.explanation && (
                        <div style={{marginTop:8, fontSize:12, color:dark?'#9ca3af':'#6b7280', lineHeight:1.5, fontStyle:'italic'}}>
                          💡 {w.explanation}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── Boutons d'action ── */}
          <div style={{display:'flex', flexDirection:'column', gap:10, width:'100%'}}>
            <button onClick={()=>{
              if (r.failed || r.masteryWarn) startLesson(curRM, curSecIdx, curLvlIdx);
              else setScreen("levels");
            }} style={{
              width:'100%', background:'linear-gradient(135deg,#3b82f6,#6366f1)',
              color:'white', borderRadius:14, padding:'14px', fontSize:15,
              fontWeight:600, border:'none', cursor:'pointer',
              boxShadow:'0 6px 20px rgba(99,102,241,0.3)'}}>
              {r.failed ? lr.retryBtn : r.masteryWarn ? lr.replayBtn : lr.cont}
            </button>
            {/* Retour aux niveaux (uniquement si échec ou score faible) */}
            {(r.failed || r.masteryWarn) && (
              <button onClick={()=>setScreen("levels")} style={{
                width:'100%', background:dark?'#161616':'white', color:dark?'#d1d5db':'#374151',
                borderRadius:14, padding:'12px', fontSize:14, fontWeight:500,
                border:`1.5px solid ${dark?'#2a2a2a':'#e5e7eb'}`, cursor:'pointer'}}>
                {lr.lvlsBtn}
              </button>
            )}
            {/* Partager */}
            <button onClick={handleShare} style={{
              width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              background:dark?'#161616':'white', color:dark?'#d1d5db':'#374151',
              borderRadius:14, padding:'12px', fontSize:14, fontWeight:500,
              border:`1.5px solid ${dark?'#2a2a2a':'#e5e7eb'}`, cursor:'pointer'}}>
              <Share2 size={15}/>{lr.share}
            </button>
            <button onClick={()=>navTo("home")} style={{
              background:'none', border:'none', cursor:'pointer', fontSize:13,
              color:dark?'#4b5563':'#9ca3af', padding:'4px'}}>{lr.home}</button>
          </div>
        </div>
      </PhoneFrame>
    );
  }


  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(RoadLearn));
</script>
</body>
</html>
