  (function() {
    try {
      var t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') document.documentElement.classList.add('dark');
    } catch(e) {}
  })();

  // Icône Apple Touch Icon générée via Canvas (nécessite PNG pour iOS)
  window.addEventListener('DOMContentLoaded', function() {
    try {
      var c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath();
      var r = 36, w = 180;
      ctx.moveTo(r,0); ctx.lineTo(w-r,0); ctx.arcTo(w,0,w,r,r);
      ctx.lineTo(w,w-r); ctx.arcTo(w,w,w-r,w,r);
      ctx.lineTo(r,w); ctx.arcTo(0,w,0,w-r,r);
      ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 88px -apple-system,system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('RL', 90, 82);
      ctx.font = '25px -apple-system,system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('LEARN', 90, 150);
      var l = document.createElement('link');
      l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
      document.head.appendChild(l);
    } catch(e) {}
  });
  // Enregistrement du Service Worker (offline + installable)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });

      { q: "Que signifie \"hoistée\" ?", answers: ["Compilée.", "Optimisée.", "Exportée.", "Disponible avant sa déclaration dans le code."], correct: 3, explanation: "Le hoisting déplace les déclarations en haut du scope avant l'exécution.", difficulty: 2 },

      { q: "Quel avantage ont les arrow functions ?", answers: ["Elles sont plus rapides.", "Elles peuvent être constructeurs.", "Elles ont leur propre `this`.", "Une syntaxe concise."], correct: 3, explanation: "Les arrow functions ont une syntaxe plus concise, et pas de propre `this`.", difficulty: 1 },

  "linux-files": {
    theory: "La gestion des fichiers sous Linux repose sur le système de permissions Unix : chaque fichier a un propriétaire (user), un groupe, et des permissions pour others. Les permissions rwx (read/write/execute) sont représentées en octal : 755 = rwxr-xr-x. chmod modifie les permissions, chown change le propriétaire. Les commandes essentielles : ls -la (liste avec permissions), cp, mv, rm, mkdir, find, ln -s (lien symbolique). /etc contient les configs système, /var les logs, /tmp les fichiers temporaires, /home les répertoires utilisateurs.",
    questions: [

      { q: "Quelle commande change les permissions d'un fichier ?", answers: ["chown", "chmod", "chgrp", "setperm"], correct: 1, explanation: "chmod 755 fichier ou chmod u+x fichier (ajoute exécution à l'utilisateur).", difficulty: 1 },

      { q: "Quelle commande change le propriétaire d'un fichier ?", answers: ["chmod", "chperm", "chown user fichier", "setowner"], correct: 2, explanation: "chown user:group fichier. chown -R pour récursif.", difficulty: 1 },

  "ml-regression": {
    theory: "La régression linéaire prédit une valeur continue (y = wx + b). Elle minimise l'erreur quadratique moyenne (MSE). La régression logistique prédit une probabilité (0 à 1) via la fonction sigmoid — elle est utilisée pour la classification binaire (spam/non-spam, malade/sain). L'overfitting survient quand le modèle mémorise les données d'entraînement mais généralise mal. La régularisation (L1=Lasso, L2=Ridge) réduit l'overfitting en pénalisant les grands coefficients. Le gradient descent optimise les paramètres en itérant dans la direction opposée au gradient de la perte.",
    questions: [
      { q: "Qu'est-ce que la régression linéaire ?", answers: ["Prédire une catégorie", "Prédire une valeur continue (y = wx + b)", "Classer des images", "Regrouper des données similaires"], correct: 1, explanation: "La régression linéaire modélise une relation linéaire entre des features et une variable cible continue (prix, température...).", difficulty: 1 },
      { q: "Quelle métrique mesure l'erreur d'une régression ?", answers: ["Accuracy", "F1-score", "MSE (Mean Squared Error)", "AUC-ROC"], correct: 2, explanation: "MSE = moyenne des (prédictions - réels)². RMSE = racine carrée du MSE, dans la même unité que y.", difficulty: 1 },
      { q: "À quoi sert la régression logistique ?", answers: ["Prédire des valeurs continues", "Classification binaire via la fonction sigmoid", "Regroupement (clustering)", "Réduction de dimension"], correct: 1, explanation: "Sigmoid(z) = 1/(1+e^-z) : sortie entre 0 et 1 interprétée comme une probabilité.", difficulty: 1 },
      { q: "Qu'est-ce que l'overfitting ?", answers: ["Le modèle est trop simple", "Le modèle mémorise les données d'entraînement et généralise mal", "Le modèle entraîne trop lentement", "Le modèle a trop peu de données"], correct: 1, explanation: "Training accuracy haute, validation accuracy basse = overfitting. Soigner avec régularisation, dropout, plus de données.", difficulty: 1 },
      { q: "Qu'est-ce que la régularisation L2 (Ridge) ?", answers: ["Supprimer les features peu importantes", "Pénaliser les grands coefficients en ajoutant λ×Σ(wi²) à la perte", "Normaliser les données d'entrée", "Réduire le learning rate"], correct: 1, explanation: "Ridge pousse les coefficients vers 0 mais pas à zéro. L1 (Lasso) peut mettre des coefficients exactement à 0 (sélection de features).", difficulty: 2 },
      { q: "Qu'est-ce que le gradient descent ?", answers: ["Un algorithme de tri", "Un optimiseur qui met à jour les paramètres dans la direction opposée au gradient", "Une fonction d'activation", "Une méthode de normalisation"], correct: 1, explanation: "w = w - lr × ∂L/∂w. Le learning rate contrôle la taille des pas. SGD, Adam, RMSprop sont des variantes.", difficulty: 2 },
      { q: "Quelle est la différence entre underfitting et overfitting ?", answers: ["Aucune", "Underfitting = modèle trop simple (biais élevé), Overfitting = trop complexe (variance élevée)", "Underfitting = trop de données, Overfitting = pas assez", "Underfitting = classification, Overfitting = régression"], correct: 1, explanation: "Bias-variance tradeoff : trop simple → ne capture pas les patterns. Trop complexe → mémorise le bruit.", difficulty: 2 },
      { q: "Qu'est-ce que le coefficient de détermination R² ?", answers: ["Le ratio erreur/données", "La proportion de variance de y expliquée par le modèle (0 à 1)", "La corrélation entre deux features", "Le nombre de paramètres du modèle"], correct: 1, explanation: "R²=1 : prédiction parfaite. R²=0 : modèle nul. Peut être négatif si pire qu'une ligne horizontale.", difficulty: 2 },

  "domain-ssl": {

  "sql-index": {
    theory: "Un index SQL est une structure de données (B-Tree par défaut) qui accélère les recherches en évitant un scan complet de la table (full table scan). CREATE INDEX nom ON table(colonne). Les index sont automatiques sur les PRIMARY KEY et UNIQUE. Un index couvre plusieurs colonnes (index composite) : CREATE INDEX ON commandes(user_id, date). Les index accélèrent les SELECT mais ralentissent les INSERT/UPDATE/DELETE. Un index partiel (WHERE) ne couvre que les lignes correspondant à la condition. EXPLAIN ANALYZE permet de vérifier si un index est utilisé.",
    questions: [

      { q: "Quand un index est-il automatiquement créé ?", answers: ["Sur toutes les colonnes", "Sur les colonnes PRIMARY KEY et UNIQUE", "Sur les colonnes de type INTEGER", "Sur les colonnes avec NOT NULL"], correct: 1, explanation: "PostgreSQL/MySQL créent automatiquement un index B-Tree sur les clés primaires et les contraintes UNIQUE.", difficulty: 1 },
      { q: "Quel est l'inconvénient d'un index ?", answers: ["Il ralentit les SELECT", "Il ralentit les INSERT/UPDATE/DELETE et prend de l'espace disque", "Il ne fonctionne que sur les entiers", "Il duplique les données"], correct: 1, explanation: "À chaque écriture, les index sont mis à jour. Trop d'index = écriture lente. À doser.", difficulty: 2 },
      { q: "Comment créer un index sur la colonne email de la table users ?", answers: ["ADD INDEX users(email)", "CREATE INDEX idx_users_email ON users(email)", "ALTER TABLE users ADD INDEX email", "INDEX ON users.email"], correct: 1, explanation: "CREATE INDEX idx_users_email ON users(email); Le nom idx_users_email est une convention.", difficulty: 1 },
      { q: "Qu'est-ce qu'un index composite ?", answers: ["Un index sur plusieurs tables", "Un index couvrant plusieurs colonnes", "Un index qui combine B-Tree et Hash", "Un index avec une condition WHERE"], correct: 1, explanation: "CREATE INDEX ON commandes(user_id, date) : efficace pour WHERE user_id=? AND date>?.", difficulty: 2 },
      { q: "Comment vérifier si une requête utilise un index ?", answers: ["SHOW INDEXES", "EXPLAIN ou EXPLAIN ANALYZE SELECT...", "DEBUG SELECT...", "PROFILE SELECT..."], correct: 1, explanation: "EXPLAIN ANALYZE montre 'Index Scan' vs 'Seq Scan'. Seq Scan sur grande table = manque d'index.", difficulty: 2 },
      { q: "Quelles colonnes bénéficient le plus d'un index ?", answers: ["Toutes les colonnes", "Colonnes souvent filtrées (WHERE), triées (ORDER BY) ou jointes (JOIN ON)", "Colonnes rarement consultées", "Colonnes TEXT très longues"], correct: 1, explanation: "Index sur les colonnes de la clause WHERE, les colonnes de JOIN et celles d'ORDER BY fréquents.", difficulty: 2 },
      { q: "Qu'est-ce qu'un index partiel (PostgreSQL) ?", answers: ["Un index sur une partie des colonnes", "Un index avec une condition WHERE (indexe seulement les lignes correspondantes)", "Un index incomplet car en cours de création", "Un index sur 50% des colonnes"], correct: 1, explanation: "CREATE INDEX ON commandes(user_id) WHERE statut='en_attente'; Index plus petit, plus rapide.", difficulty: 3 },
      { q: "Qu'est-ce qu'un index GIN dans PostgreSQL ?", answers: ["Un index B-Tree générique", "Un index pour les types composites (JSONB, tableau, recherche full-text)", "Un index de hachage", "Un index bitmap"], correct: 1, explanation: "GIN (Generalized Inverted Index) : pour ts_vector (full-text), JSONB @>, tableau @>.", difficulty: 3 },
      { q: "Pourquoi un index sur une colonne à faible cardinalité (ex: genre M/F) est peu utile ?", answers: ["Les index ne fonctionnent que sur les entiers", "Si peu de valeurs distinctes, l'index ne réduit pas assez les lignes à scanner", "Les colonnes M/F ne sont pas indexables", "L'optimiseur ignore toujours ces index"], correct: 1, explanation: "L'optimiseur préfère un Seq Scan si l'index retourne trop de lignes. Index utile sur haute cardinalité (email, ID).", difficulty: 3 },
      { q: "Qu'est-ce qu'un index couvrant (covering index) ?", answers: ["Un index sur toutes les colonnes", "Un index incluant toutes les colonnes de la requête (évite d'accéder à la table)", "Un index sur une vue", "Un index multi-table"], correct: 1, explanation: "INCLUDE (PostgreSQL) : CREATE INDEX ON users(email) INCLUDE (nom); SELECT nom WHERE email=? n'accède pas à la table.", difficulty: 3 },

  "sql-transactions": {
    theory: "Une transaction SQL est un ensemble d'opérations traitées comme une unité atomique. ACID : Atomicité (tout ou rien), Cohérence (état valide avant/après), Isolation (transactions concurrentes isolées), Durabilité (données persistées après COMMIT). Commandes : BEGIN, COMMIT, ROLLBACK, SAVEPOINT. Les niveaux d'isolation (READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE) contrôlent les phénomènes : dirty read, non-repeatable read, phantom read. Les verrous (LOCK) évitent les conflits d'écriture concurrente.",
    questions: [
      { q: "Qu'est-ce qu'une transaction SQL ?", answers: ["Une requête SELECT complexe", "Un ensemble d'opérations traitées comme une unité atomique (tout ou rien)", "Une procédure stockée", "Un batch de requêtes sans lien"], correct: 1, explanation: "BEGIN; INSERT...; UPDATE...; COMMIT; — si une étape échoue, ROLLBACK annule tout.", difficulty: 1 },
      { q: "Que signifie l'Atomicité dans ACID ?", answers: ["Les opérations sont indivisibles (tout ou rien)", "Les données sont cohérentes après la transaction", "Chaque transaction voit un snapshot isolé", "Les données sont durables après COMMIT"], correct: 0, explanation: "Atomicité : si l'une des opérations échoue, toutes sont annulées. Pas d'état partiel.", difficulty: 1 },
      { q: "Que signifie l'Isolation dans ACID ?", answers: ["Chaque transaction est isolée dans un schéma séparé", "Les transactions concurrentes ne s'interfèrent pas (comme si séquentielles)", "Les données sont isolées dans des partitions", "Chaque utilisateur a une base isolée"], correct: 1, explanation: "Niveau d'isolation : contrôle ce qu'une transaction peut voir des données modifiées par une autre.", difficulty: 1 },
      { q: "Quelle commande valide définitivement une transaction ?", answers: ["SAVE", "END", "COMMIT", "APPLY"], correct: 2, explanation: "COMMIT rend les changements permanents et visibles aux autres transactions.", difficulty: 1 },
      { q: "Quelle commande annule une transaction en cours ?", answers: ["CANCEL", "UNDO", "ROLLBACK", "ABORT"], correct: 2, explanation: "ROLLBACK annule toutes les opérations depuis le BEGIN (ou le dernier SAVEPOINT).", difficulty: 1 },
      { q: "Qu'est-ce qu'un SAVEPOINT ?", answers: ["Une sauvegarde automatique", "Un point de restauration partielle dans une transaction", "Un snapshot de la base", "Un alias de COMMIT"], correct: 1, explanation: "SAVEPOINT sp1; ... ROLLBACK TO sp1; Annule seulement jusqu'au savepoint, pas toute la transaction.", difficulty: 2 },
      { q: "Qu'est-ce qu'un dirty read ?", answers: ["Lire des données corrompues", "Lire des données non encore committées par une autre transaction", "Lire des données supprimées", "Lire deux fois la même donnée"], correct: 1, explanation: "Possible en READ UNCOMMITTED seulement. Dangereux si l'autre transaction fait ROLLBACK.", difficulty: 2 },
      { q: "Qu'est-ce qu'un phantom read ?", answers: ["Lire des données inexistantes", "Des nouvelles lignes apparaissent entre deux lectures de la même requête dans une transaction", "Lire des données supprimées", "Lire une valeur modifiée entre deux lectures"], correct: 1, explanation: "Transaction A: SELECT COUNT(*) → 10. Transaction B insère. Transaction A: SELECT COUNT(*) → 11. Phantom!", difficulty: 2 },
      { q: "Quel niveau d'isolation est le plus strict ?", answers: ["READ COMMITTED", "REPEATABLE READ", "SERIALIZABLE", "READ UNCOMMITTED"], correct: 2, explanation: "SERIALIZABLE : transactions exécutées comme si séquentielles. Élimine dirty read, non-repeatable et phantom reads.", difficulty: 2 },
      { q: "Quel niveau d'isolation est le défaut dans PostgreSQL ?", answers: ["READ UNCOMMITTED", "READ COMMITTED", "REPEATABLE READ", "SERIALIZABLE"], correct: 1, explanation: "PostgreSQL : READ COMMITTED par défaut. Chaque instruction voit les données committées au moment de son exécution.", difficulty: 2 },
      { q: "Qu'est-ce qu'un deadlock ?", answers: ["Une transaction qui dure trop longtemps", "Deux transactions qui s'attendent mutuellement (cycle de verrous)", "Un ROLLBACK automatique", "Un verrou persistant indéfiniment"], correct: 1, explanation: "A attend la ressource de B, B attend celle de A. Le SGBD détecte et tue l'une des transactions.", difficulty: 2 },

function detectTopicKey(levelName) {
  const n = levelName.toLowerCase();

  // ── HTTP / Protocoles réseau ──
  if (n.includes("http") && (n.includes("protocole") || n.includes("web") || n.includes("réseau"))) return "http";

  // ── HTML ──
  if (n.includes("html") && (n.includes("formulaire") || n.includes("média") || n.includes("media") || n.includes("form"))) return "html-forms";
  if (n.includes("html")) return "html";

  // ── CSS ──
  if (n.includes("flexbox") || (n.includes("css") && n.includes("flex"))) return "flexbox";
  if (n.includes("grid") && (n.includes("css") || n.includes("layout") || n.includes("grille"))) return "grid";
  if (n.includes("responsive") || n.includes("media quer") || n.includes("media-quer")) return "css-responsive";
  if (n.includes("css")) return "css";

  // ── Variables d'environnement (avant JS pour éviter le clash avec "variable") ──
  if (n.includes("variable") && n.includes("environnement")) return "env-vars";

  // ── JavaScript ──
  if (n.includes("dom") || n.includes("manipulation")) return "dom";
  if ((n.includes("event") || n.includes("événement")) && !n.includes("loop")) return "js-events";
  if (n.includes("api") && n.includes("rest") && !n.includes("fetch")) return "rest-api";
  if (n.includes("fetch") || (n.includes("api") && n.includes("rest"))) return "js-fetch";
  if (n.includes("promise") || n.includes("async") || n.includes("await")) return "async";
  if (n.includes("module") && (n.includes("es") || n.includes("js"))) return "js-modules";
  if (n.includes("fonctions") || n.includes("scope") || n.includes("closure") || (n.includes("js") && n.includes("fonction"))) return "js-functions";
  // ── Vue.js / TypeScript (avant le catch-all JS pour éviter le clash "type" dans "typescript") ──
  if (n.includes("vue.js") || n.includes("vuejs") || n.includes("vue —")) return "vuejs";
  if (n.includes("typescript") || n.includes("types &") || n.includes("interface")) return "typescript";

  if (n.includes("javascript") || n.includes("js —") || n.includes("variable") || n.includes("type")) return "javascript";

  // ── React ──
  if (n.includes("react") && (n.includes("hook") || n.includes("usestate") || n.includes("useeffect") || n.includes("usememo"))) return "react-hooks";
  if (n.includes("react") && (n.includes("state") || n.includes("props") || n.includes("context"))) return "react-state";
  if (n.includes("react") || n.includes("jsx") || n.includes("composant")) return "react";
  if (n.includes("crud") && (n.includes("react") || n.includes("node"))) return "react";

  // ── Express (avant Node.js pour éviter le catch-all nodejs) ──
  if (n.includes("express")) return "express";

  // ── Node.js ──
  if ((n.includes("node") || n.includes("npm")) && (n.includes("module") || n.includes("npm"))) return "nodejs-modules";
  if (n.includes("upload")) return "nodejs-modules";
  if (n.includes("node") || n.includes("npm")) return "nodejs";

  // ── SQL & Data ──
  if (n.includes("jointure") || n.includes("join") || n.includes("inner") || n.includes("left") || n.includes("right")) return "sql-joins";
  if (n.includes("agrégation") || n.includes("group by") || n.includes("aggreg")) return "sql-aggregations";
  if (n.includes("transaction") || n.includes("acid")) return "sql-transactions";
  if (n.includes("over") || n.includes("fenêtre")) return "sql-window";
  if (n.includes("normalisation") || n.includes("modélisation")) return "sql-modeling";
  if (n.includes("index") && (n.includes("performance") || n.includes("bases") || n.includes("sql") || n.includes("&"))) return "sql-index";
  if (n.includes("sous-requête")) return "sql-advanced";
  if (n.includes("postgresql") || n.includes("postgres")) return "postgresql";
  if (n.includes("sql") || n.includes("requête") || n.includes("select") || n.includes("filtres")) return "sql";

  // ── Git / CI-CD ──
  if (n.includes("gitlab")) return "gitlab";
  if (n.includes("github actions") || n.includes("workflows") || n.includes("ci/cd")) return "github-actions";
  if (n.includes("git") && (n.includes("merge") || n.includes("rebase") || n.includes("conflit"))) return "git-advanced";
  if (n.includes("git") || n.includes("branche") || n.includes("commit")) return "git";

  // ── Docker / Kubernetes / Cloud ──
  if (n.includes("kubernetes") || n.includes("pods") || n.includes("k8s")) return "kubernetes";
  if (n.includes("compose")) return "docker-compose";
  if (n.includes("docker") || n.includes("conteneur")) return "docker";
  if (n.includes("aws") || n.includes("amazon")) return "aws";

  // ── Auth & Sécurité (ordre précis pour éviter les chevauchements) ──
  if (n.includes("jwt")) return "jwt";
  if (n.includes("oauth") || n.includes("openid")) return "oauth";
  if (n.includes("hachage") || n.includes("cryptographie")) return "hashing";
  if (n.includes("authentification")) return "auth-fullstack";
  if (n.includes("sécuris")) return "api-security";

  // ── Bases de données NoSQL ──
  if (n.includes("mongodb") || n.includes("document") || n.includes("collection")) return "mongodb";
  if (n.includes("redis") || n.includes("cache") || n.includes("session")) return "redis";

  // ── GraphQL / WebSockets ──
  if (n.includes("graphql") || n.includes("schéma") || n.includes("resolver")) return "graphql";
  if (n.includes("websocket") || n.includes("socket") || n.includes("temps réel")) return "websockets";

  // ── Linux / Bash / SSH ──
  if (n.includes("bash") || n.includes("scripting") || n.includes("shell")) return "bash";
  if (n.includes("ssh") || n.includes("accès distant")) return "linux-ssh";
  if (n.includes("fichier") || (n.includes("permission") && !n.includes("api"))) return "linux-files";
  if (n.includes("linux") || n.includes("commande")) return "linux";

  // ── IA & ML ──
  if (n.includes("régression")) return "ml-regression";
  if (n.includes("arbre") || n.includes("random forest")) return "ml-trees";
  if (n.includes("évaluation") || n.includes("métrique")) return "ml-metrics";
  if (n.includes("numpy") || n.includes("pandas")) return "numpy-pandas";
  if (n.includes("matplotlib")) return "matplotlib";
  if (n.includes("machine learning") || n.includes("apprentissage") || n.includes("dataset") || n.includes("feature")) return "ml-concepts";
  if (n.includes("python") || n.includes("data science")) return "python-data";
  if (n.includes("llm") || n.includes("language model") || n.includes("transformer")) return "llm";
  if (n.includes("prompt") || n.includes("prompting")) return "prompt-eng";
  if (n.includes("rag") || n.includes("retrieval") || n.includes("augmented")) return "rag";

  // ── Frontend avancé ──
  if (n.includes("pwa") || n.includes("progressive web") || n.includes("service worker")) return "pwa";
  if (n.includes("test") || n.includes("jest") || n.includes("testing library")) return "testing";
  if (n.includes("vite") || n.includes("webpack") || n.includes("build tool")) return "build-tools";
  if (n.includes("performance") || n.includes("optimis")) return "performance";
  if (n.includes("accessibilité") || n.includes("a11y") || n.includes("wcag")) return "accessibility";

  // ── Architecture Full Stack ──
  if (n.includes("microservice") || n.includes("monolithe")) return "monolith-microservices";
  if (n.includes("api-first") || (n.includes("api") && n.includes("first"))) return "api-first";
  if (n.includes("mvc") || (n.includes("architecture") && !n.includes("microservice"))) return "mvc";
  if (n.includes("design pattern") || n.includes("pattern")) return "design-patterns";

  // ── ORM & Queues ──
  if (n.includes("orm") || n.includes("prisma") || n.includes("sequelize")) return "orm";
  if (n.includes("queue") || n.includes("worker") || n.includes("bull")) return "queues";

  // ── Paiement & Déploiement ──
  if (n.includes("stripe") || n.includes("paiement")) return "stripe";
  if (n.includes("domaine") || n.includes("ssl") || n.includes("certificat")) return "domain-ssl";
  if (n.includes("hébergement") || n.includes("vercel") || n.includes("railway") || n.includes("render") || n.includes("déploiement")) return "hosting";

  return "generic";
}

// Détermine le niveau de difficulté selon la section de la roadmap
function getDifficultyFromSection(sectionTitle) {
  const t = (sectionTitle || "").toLowerCase();
  // Sections avancées → difficulté 3
  if (t.includes("avancé") || t.includes("frameworks") || t.includes("sécurité") || t.includes("llm") || t.includes("prompting") || t.includes("déploiement")) return 3;
  // Sections intermédiaires → difficulté 2
  if (t.includes("javascript") || t.includes("bases de données") || t.includes("conteneur") || t.includes("git") || t.includes("modèles") || t.includes("projet") || t.includes("ci/cd")) return 2;
  // Sections débutantes → difficulté 1
  return 1;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateMockSteps(levelName, sectionTitle) {
  const key = detectTopicKey(levelName);
  const topic = MOCK_DB[key] || MOCK_DB.generic;

  // Toujours piocher 5 questions au hasard dans tout le pool (15 questions)
  // pour garantir de la variété à chaque session.
  return [
    { type: "theory", content: topic.theory },
    ...shuffle(topic.questions).slice(0, 5).map(q => ({ type: "quiz", ...q })),
  ];
}

  if (xp < 100)  return { n:1, next:100 };
  if (xp < 300)  return { n:2, next:300 };

  if (xp < 1000) return { n:4, next:1000 };

  return { n:6, next:2000 };
}

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.45);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      osc.frequency.setValueAtTime(200, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    }
  } catch(_) {}
}

// ── Daily Challenge (question du jour déterministe) ───────────────────────────
function getDailyChallenge() {
  const today = new Date().toISOString().slice(0, 10);
  const keys = Object.keys(MOCK_DB).filter(k => MOCK_DB[k].questions && MOCK_DB[k].questions.length >= 2);
  // Seed stable basé sur la date
  const seed = today.replace(/-/g, '').split('').reduce((a, c, i) => a + c.charCodeAt(0) * (i + 1), 0);
  const key  = keys[seed % keys.length];
  const pool = MOCK_DB[key].questions.filter(q => q.difficulty === 1 || q.difficulty === 2);
  const q    = pool[seed % pool.length] || MOCK_DB[key].questions[0];
  return { ...q, topicKey: key, date: today, theory: MOCK_DB[key].theory };
}

  const GTRANSLATE_LANG = { fr:'fr', en:'en', es:'es', pt:'pt', de:'de', it:'it', nl:'nl', ja:'ja' };
  async function gTranslate(texts, tl) {
    if (tl === 'fr') return texts;
    const SEP = '\n|||SEP|||\n';
    // Découper en lots ≤ 3800 chars
    const batches = [];
    let cur = [], curLen = 0;
    for (const tx of texts) {
      if (curLen + tx.length + SEP.length > 3800 && cur.length) {
        batches.push(cur); cur = [tx]; curLen = tx.length;
      } else { cur.push(tx); curLen += tx.length + SEP.length; }
    }
    if (cur.length) batches.push(cur);
    const out = [];
    for (const batch of batches) {
      const q = batch.join(SEP);
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${tl}&dt=t&q=${encodeURIComponent(q)}`;
      const r = await fetch(url);
      const d = await r.json();
      const translated = d[0].map(x => x[0]).join('');
      const pieces = translated.split(SEP.trim());
      // En cas de décalage, recompleter avec originaux
      for (let i = 0; i < batch.length; i++) out.push(pieces[i] !== undefined ? pieces[i].trim() : batch[i]);
    }
    return out;
  }

  const TTS_LANG = { fr:'fr-FR', en:'en-US', es:'es-ES', pt:'pt-BR', de:'de-DE', it:'it-IT', nl:'nl-NL', ja:'ja-JP' };
  function stopAudio() {
    if (audioRef.current) { try { audioRef.current.pause(); } catch(_) {} audioRef.current = null; }

  // ── TTS multiplateforme (Google cloud + Web Speech API fallback) ────────────
  // Sur iOS, speechSynthesis.speak() DOIT être appelé synchroniquement depuis
  // le geste utilisateur. Un appel depuis audio.onerror (async) perd ce contexte
  // et est silencieusement bloqué. → On détecte iOS et on bypass Google TTS.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function speakText(text) {
    if (!text) return;
    if (ttsPlaying) { stopAudio(); return; }
    stopAudio();
    setTtsPlaying(true);
    const tl = GTRANSLATE_LANG[lang] || 'fr';
    const ttsLang = TTS_LANG[lang] || 'fr-FR';

    // ── Web Speech API (iOS natif + fallback universel) ───────────────────────
    function useWebSpeech(remaining) {
      audioRef.current = null;
      if (!('speechSynthesis' in window)) { setTtsPlaying(false); return; }
      window.speechSynthesis.cancel();
      const doSpeak = () => {
        const u = new SpeechSynthesisUtterance(remaining);
        u.lang = ttsLang; u.rate = ttsSpeed;
        // Sélectionner la meilleure voix disponible pour la langue
        const vv = window.speechSynthesis.getVoices();
        const best = vv.find(v => v.lang === ttsLang) ||
                     vv.find(v => v.lang.startsWith(ttsLang.split('-')[0]));
        if (best) u.voice = best;
        u.onend = () => setTtsPlaying(false);
        u.onerror = () => setTtsPlaying(false);
        window.speechSynthesis.speak(u);
      };
      const vv = window.speechSynthesis.getVoices();
      if (vv.length > 0) { doSpeak(); return; }
      // Voix pas encore chargées (iOS/Firefox) — attendre l'événement + timeout
      let done = false;
      window.speechSynthesis.onvoiceschanged = () => {
        if (done) return; done = true;
        window.speechSynthesis.onvoiceschanged = null; doSpeak();
      };
      setTimeout(() => { if (!done) { done = true; doSpeak(); } }, 500);
    }

    // Sur iOS : appel synchrone direct (toujours dans le contexte du geste)
    if (isIOS) { useWebSpeech(text); return; }

    // ── Découpe en segments ≤ 175 chars (limite Google TTS) ──────────────────
    const chunks = [];
    const sents = text.split(/(?<=[.!?;])\s+/);
    let cur = '';
    for (const s of sents) {
      if ((cur + ' ' + s).length > 175 && cur) { chunks.push(cur.trim()); cur = s; }
      else cur = cur ? cur + ' ' + s : s;
    }
    if (cur.trim()) chunks.push(cur.trim());
    if (!chunks.length) { setTtsPlaying(false); return; }
    let idx = 0;
    let usedFallback = false;

    // ── Primaire : Google TTS cloud (haute qualité, sans téléchargement) ──────
    function playChunk() {
      if (usedFallback) return;
      if (idx >= chunks.length) { setTtsPlaying(false); audioRef.current = null; return; }
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(chunks[idx])}&tl=${tl}&client=tw-ob`;
      const audio = new Audio();
      audioRef.current = audio;
      audio.playbackRate = Math.max(0.5, Math.min(ttsSpeed * 1.1, 2.0));
      audio.onended = () => { idx++; playChunk(); };
      audio.onerror = () => { usedFallback = true; useWebSpeech(chunks.slice(idx).join(' ')); };
      audio.src = url;
      const p = audio.play();
      if (p) p.catch(() => { usedFallback = true; useWebSpeech(chunks.slice(idx).join(' ')); });
    }
    playChunk();
  }

  const avatarLetter = username ? username.charAt(0).toUpperCase() : "J";

  function getLevelIdx(rmId, secIdx, lvlIdx) {
    const rm = ROADMAPS.find(r => r.id === rmId);

  function startLesson(rmId, secIdx, lvlIdx) {
    setCurRM(rmId); setCurSecIdx(secIdx); setCurLvlIdx(lvlIdx);
    setStepIdx(0); setLives(3); setCorrect(0);
    setAnswered(false); setSelectedAns(null); setError(null);
    setShowErrorReview(false); setConfetti(false);
    wrongAnswersRef.current = [];

    const rm = ROADMAPS.find(r => r.id === rmId);
    const sec = rm.sections[secIdx];
    const lv = sec.levels[lvlIdx];
    const rawSteps = generateMockSteps(lv.name, sec.title);
    setSteps(rawSteps);
    setTSteps(null);
    setLoading(false);
    setScreen("lesson");
    // Traduction automatique si langue ≠ français
    if (lang !== 'fr') {
      setTranslating(true);
      translateStepsData(rawSteps, lang).then(translated => {
        setTSteps(translated);
        setTranslating(false);
      }).catch(() => setTranslating(false));
    }
  }

  function handleAnswer(idx) {
    if (answered) return;
    const step = steps[stepIdx];
    setSelectedAns(idx); setAnswered(true);
    if (idx === step.correct) {
      setCorrect(c => c + 1);
      playBeep('correct');
    } else {
      setLives(l => Math.max(0, l - 1));
      playBeep('wrong');
      wrongAnswersRef.current = [...wrongAnswersRef.current, { ...step, chosen: idx }];
    }
  }

  function nextStep() {
    if (lives === 0) { endLesson(true); return; }
    if (stepIdx+1 >= steps.length) { endLesson(false); return; }
    setStepIdx(i => i+1); setAnswered(false); setSelectedAns(null);
  }

  function endLesson(failed) {
    const rm = ROADMAPS.find(r => r.id === curRM);
    const lv = rm.sections[curSecIdx].levels[curLvlIdx];
    const quizCount = steps.filter(s => s.type !== "theory").length;
    const acc = quizCount ? Math.round((correct/quizCount)*100) : 100;
    const perfect = acc === 100 && !failed;
    const masteryWarn = !failed && !perfect && acc < 70; // Mastery Gate : suggérer de rejouer
    const xpGain = failed ? Math.round(lv.xp*0.2) : perfect ? lv.xp : Math.round(lv.xp*0.7);
    const today = new Date().toISOString().slice(0, 10);
    setState(s => {
      const newDone = { ...s.done };
      let newLvlDone = s.lvlDone;
      let newReplayed = s.replayed || 0;
      if (!failed) {
        const fi = getLevelIdx(curRM, curSecIdx, curLvlIdx);
        if (!newDone[curRM]) newDone[curRM] = [];
        if (!newDone[curRM].includes(fi)) {
          newDone[curRM] = [...newDone[curRM], fi];
          newLvlDone += 1;
        } else {
          newReplayed += 1; // rejoué un niveau déjà fait
        }
      }
      const newDates = [...new Set([...(s.sessionDates||[]), today])].slice(-90);
      const newBestStreak = Math.max(s.bestStreak || 1, s.streak || 1);
      return {
        ...s,
        xp: s.xp + xpGain,
        lvlDone: newLvlDone,
        done: newDone,
        perfectQuiz: perfect ? s.perfectQuiz + 1 : s.perfectQuiz,
        sessionDates: newDates,
        bestStreak: newBestStreak,
        replayed: newReplayed,
      };
    });
    if (perfect) setTimeout(() => setConfetti(true), 200);
    setResultData({
      failed, perfect, masteryWarn, xpGain,
      score: correct, total: quizCount, acc, livesLeft: lives,
      wrongAnswers: wrongAnswersRef.current,
      levelName: lv.name,
    });
    setScreen("result");
  }

            display:'flex', alignItems:'center', justifyContent:'center',
            boxShadow:'0 16px 40px rgba(99,102,241,0.4), 0 4px 12px rgba(0,0,0,0.1)'

            <span style={{fontSize:40}}>🚀</span>

        <div style={{fontSize:30, fontWeight:800, marginBottom:6, textAlign:'center', color: dark?'#fafafa':'#0f172a', letterSpacing:-1}}>

        </div>
        <div style={{fontSize:14, textAlign:'center', marginBottom:28, color: dark?'#a1a1aa':'#64748b', lineHeight:1.65, maxWidth:280}}>

        {/* Pill badges */}
        <div style={{display:'flex', gap:7, marginBottom:28, flexWrap:'wrap', justifyContent:'center'}}>

              fontSize:11, fontWeight:600, padding:'5px 11px', borderRadius:99,
              background: dark?'rgba(99,102,241,0.1)':'#eef2ff',
              color: dark?'#a5b4fc':'#6366f1',
              border:`1px solid ${dark?'rgba(99,102,241,0.2)':'#c7d2fe'}`

        <div style={{width:'100%', marginBottom:16}}>
          <label style={{fontSize:12, fontWeight:700, color: dark?'#a1a1aa':'#475569', display:'block', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.06em'}}>
            {t.home?.start?.nameLabel||"Comment tu t'appelles ?"} <span style={{color: dark?'#3f3f46':'#94a3b8', fontWeight:400, textTransform:'none', letterSpacing:0}}>{t.home?.start?.nameOpt||"(optionnel)"}</span>
          </label>

            style={{
              width:'100%', border:`1.5px solid ${dark?'#27272a':'#e2e8f0'}`,
              borderRadius:14, padding:'13px 16px', fontSize:15,
              background: dark?'#111113':'#f8fafc',
              color: dark?'#fafafa':'#0f172a',
              outline:'none', transition:'border-color 0.2s, box-shadow 0.2s'
            }}
            onFocus={e=>{e.target.style.borderColor='#6366f1';e.target.style.boxShadow='0 0 0 3px rgba(99,102,241,0.15)';}}
            onBlur={e=>{e.target.style.borderColor=dark?'#27272a':'#e2e8f0';e.target.style.boxShadow='none';}}
          />
        </div>
        <button onClick={handleStart} style={{
          width:'100%', background:'linear-gradient(135deg,#6366f1,#8b5cf6)',
          color:'white', borderRadius:14, padding:'15px 0', fontSize:16,
          fontWeight:700, border:'none', cursor:'pointer',
          boxShadow:'0 8px 28px rgba(99,102,241,0.4)',
          letterSpacing:-0.2
        }}>
          {t.home?.start?.startBtn||"Commencer gratuitement →"}
        </button>
        <div style={{fontSize:12, color: dark?'#3f3f46':'#94a3b8', marginTop:18, textAlign:'center'}}>
          {t.home?.start?.footer||"🔒 Cours intégrés · Aucune clé API nécessaire"}
        </div>
      </div>
    </PhoneFrame>
  );

  // ── Accueil ───────────────────────────────────────────────────────────────
  if (screen === "home") return (
    <PhoneFrame>
      {/* Header */}
      <div style={{padding:'14px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0, borderBottom:`1px solid ${dark?'#1c1c1f':'#f0f0f5'}`}}>
        <div style={{fontSize:19, fontWeight:800, letterSpacing:-0.5, color: dark?'#fafafa':'#0f172a'}}>
          Road<span style={{color:'#6366f1'}}>Learn</span>
        </div>
        <div style={{display:'flex', gap:6, alignItems:'center'}}>
          <div style={{display:'flex', alignItems:'center', gap:4, background: dark?'rgba(99,102,241,0.15)':'#eef2ff', color: dark?'#a5b4fc':'#4f46e5', borderRadius:99, padding:'5px 10px', fontSize:11, fontWeight:700}}>
            <Zap size={11}/><span>{state.xp} XP</span>
          </div>
          <div title={`Meilleur streak : ${state.bestStreak||1} jours`}
            style={{display:'flex', alignItems:'center', gap:4, background: dark?'rgba(245,158,11,0.12)':'#fef9e7', color: dark?'#fbbf24':'#b45309', borderRadius:99, padding:'5px 10px', fontSize:11, fontWeight:700, cursor:'default'}}>
            <Flame size={11}/><span>{state.streak}🔥{state.streak>=7?' 🌟':''}</span>
          </div>
        </div>
      </div>

      <div style={{flex:1, overflowY:'auto'}}>
        {/* Profil + niveau */}
        <div style={{margin:'12px 16px', padding:'16px', borderRadius:20,
          background: dark?'linear-gradient(135deg,#18183a,#1e1b4b)':'linear-gradient(135deg,#eef2ff,#f0f9ff)',
          border:`1px solid ${dark?'#2d2a6a':'#c7d2fe'}`,
          boxShadow: dark?'0 4px 20px rgba(99,102,241,0.1)':'0 4px 20px rgba(99,102,241,0.08)'}}>
          <div style={{display:'flex', alignItems:'center', gap:12}}>
            {profilePhoto ? (
              <img src={profilePhoto} alt="" style={{width:50,height:50,borderRadius:'50%',objectFit:'cover',flexShrink:0,boxShadow:'0 4px 14px rgba(99,102,241,0.4)'}}/>
            ) : (
              <div style={{
                width:50, height:50, borderRadius:'50%', flexShrink:0,
                background:'linear-gradient(135deg,#6366f1,#8b5cf6)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:19, fontWeight:700, color:'white',
                boxShadow:'0 4px 14px rgba(99,102,241,0.4)'
              }}>{avatarLetter}</div>
            )}
            <div style={{flex:1}}>
              <div style={{fontSize:15, fontWeight:700, color: dark?'#fafafa':'#0f172a', letterSpacing:-0.2}}>{username}</div>
              <div style={{fontSize:12, color: dark?'#a5b4fc':'#6366f1', fontWeight:600, marginTop:1}}>{(L_PROFILE[lang]||L_PROFILE.fr).level} {ul.n} · {(USER_RANKS[lang]||USER_RANKS.fr)[ul.n-1]}</div>
            </div>
          </div>
          <div style={{marginTop:12}}>
            <div style={{height:7, background: dark?'rgba(99,102,241,0.2)':'#c7d2fe', borderRadius:99, overflow:'hidden'}}>
              <div className="progress-bar" style={{height:'100%', borderRadius:99, background:'linear-gradient(90deg,#6366f1,#8b5cf6)', width:`${xpPct}%`}}/>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, color: dark?'#a5b4fc':'#6366f1', marginTop:5, fontWeight:600}}>
              <span>{state.xp} XP</span><span>{ul.next} XP → {t.home?.nextLvl||'niv.'} {ul.n+1}</span>
            </div>
          </div>
        </div>

        {/* Streak milestone banner */}
        {[7,14,30,60,100].includes(state.streak) && (
          <div className="slide-up" style={{margin:'0 16px 10px', padding:'10px 14px', borderRadius:14,
            background:'linear-gradient(135deg,#f59e0b,#ef4444)',
            display:'flex', alignItems:'center', gap:10}}>
            <span style={{fontSize:24}}>🔥</span>
            <div>
              <div style={{fontSize:13, fontWeight:700, color:'white'}}>{state.streak} {t.home?.streakMsg||'jours de série !'}</div>
              <div style={{fontSize:11, color:'rgba(255,255,255,0.85)'}}>{t.home?.streakSub||'Incroyable — tu es vraiment assidu'}{state.streak>=30?' 🏆':' ⭐'}</div>
            </div>
          </div>
        )}

        {/* Stats */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, padding:'0 16px', marginBottom:16}}>
          {[{v:state.xp,l:t.home?.xpTotal||'XP totaux',icon:'⚡',c:dark?'rgba(99,102,241,0.12)':'#eef2ff',tc:dark?'#a5b4fc':'#4f46e5'},
            {v:state.lvlDone,l:(L_PROFILE[lang]||L_PROFILE.fr).levels,icon:'✅',c:dark?'rgba(5,150,105,0.12)':'#f0fdf4',tc:dark?'#6ee7b7':'#059669'},
            {v:`${state.streak}`,l:t.home?.days||'Jours',icon:'🔥',c:dark?'rgba(245,158,11,0.12)':'#fef9e7',tc:dark?'#fbbf24':'#b45309'}
          ].map((s,i)=>(
            <div key={i} style={{
              background: s.c,
              border:`1px solid ${dark?'#27272a':'#f1f5f9'}`,
              borderRadius:16, padding:'12px 6px', textAlign:'center'
            }}>
              <div style={{fontSize:20, marginBottom:3}}>{s.icon}</div>
              <div style={{fontSize:18, fontWeight:800, color: s.tc, letterSpacing:-0.5}}>{s.v}</div>
              <div style={{fontSize:10, color: dark?'#52525b':'#94a3b8', marginTop:3, fontWeight:500}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* ── Reprendre (prochain niveau débloqué) ──────────────────────── */}
        {(() => {
          let next = null;
          const resumeRMs = tRoadmaps || ROADMAPS;
          for (const rm of resumeRMs) {
            if (next) break;
            for (let si = 0; si < rm.sections.length && !next; si++) {
              for (let li = 0; li < rm.sections[si].levels.length && !next; li++) {
                if (!isDone(rm.id,si,li) && isUnlocked(rm.id,si,li))
                  next = { rm, si, li, lv: rm.sections[si].levels[li] };
              }
            }
          }
          if (!next) return null;
          return (
            <div style={{padding:'0 16px', marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', marginBottom:8}}>{t.home?.resume||'REPRENDRE'}</div>
              <button onClick={()=>startLesson(next.rm.id,next.si,next.li)}
                style={{width:'100%', display:'flex', alignItems:'center', gap:12,
                  padding:'13px 14px', borderRadius:16, border:'none', cursor:'pointer', textAlign:'left',
                  background:'linear-gradient(135deg,#3b82f6,#6366f1)',
                  boxShadow:'0 6px 20px rgba(99,102,241,0.28)'}}>
                <div style={{width:42,height:42,borderRadius:13,background:'rgba(255,255,255,0.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>
                  {next.rm.icon}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:'white',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{next.lv.name}</div>
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.75)'}}>{next.rm.name} · +{next.lv.xp} XP</div>
                </div>
                <ChevronRight size={18} style={{color:'rgba(255,255,255,0.8)',flexShrink:0}}/>
              </button>
            </div>
          );
        })()}

        {/* ── Daily Challenge ───────────────────────────────────────────── */}
        {(() => {
          const dc = tDailyChallenge || getDailyChallenge();
          const today = new Date().toISOString().slice(0,10);
          const dcAlreadyDone = state.dailyChallenge && state.dailyChallenge.date === today && state.dailyChallenge.done;
          const letters = ["A","B","C","D"];
          return (
            <div style={{padding:'0 16px', marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', marginBottom:8}}>{t.home?.daily||'DÉFI DU JOUR'}</div>
              <div style={{borderRadius:16, padding:'14px',
                border:`1.5px solid ${dcAlreadyDone?(dark?'#059669':'#6ee7b7'):(dark?'#2a2a2a':'#e0e7ff')}`,
                background: dcAlreadyDone?(dark?'#064e3b':'#f0fdf4'):(dark?'#161616':'#fafaff')}}>
                {dcAlreadyDone ? (
                  <div style={{textAlign:'center',padding:'6px 0'}}>
                    <div style={{fontSize:32,marginBottom:6}}>✅</div>
                    <div style={{fontSize:14,fontWeight:600,color:dark?'#34d399':'#059669'}}>{t.home?.dailyDone||'Défi du jour complété !'}</div>
                    <div style={{fontSize:12,color:dark?'#6b7280':'#9ca3af',marginTop:4}}>
                      {state.dailyChallenge.correct ? (t.home?.dailyCorrect||'+20 XP gagnés 🎉') : (t.home?.dailyWrong||'+5 XP · Reviens demain')}
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <span style={{fontSize:18}}>⚡</span>
                      <div style={{fontSize:13,fontWeight:700,color:dark?'#f9fafb':'#111827',flex:1}}>{t.home?.dailyQ||'Question du jour'}</div>
                      <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:99,background:'#eff6ff',color:'#1d4ed8'}}>+20 XP</span>
                    </div>
                    <div style={{fontSize:13,lineHeight:1.6,color:dark?'#d1d5db':'#374151',marginBottom:12}}>{dc.q}</div>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {(dc.answers||[]).map((a,i) => {
                        let cls = '';
                        if (dailyChallengeResult) {
                          if (i === dailyChallengeResult.correct) cls = 'dc-btn-correct';
                          else if (i === dailyChallengeResult.chosen) cls = 'dc-btn-wrong';
                          else cls = 'dc-btn-neutral';
                        }
                        return (
                          <button key={i} onClick={()=>handleDailyChallenge(dc,i)} disabled={!!dailyChallengeResult}
                            className={cls}
                            style={{padding:'9px 12px',borderRadius:12,fontSize:12,textAlign:'left',cursor:dailyChallengeResult?'default':'pointer',
                              border:`1.5px solid ${dark?'#2a2a2a':'#e5e7eb'}`,background:dark?'#0f0f0f':'white',color:dark?'#d1d5db':'#374151',
                              display:'flex',alignItems:'center',gap:8,transition:'all 0.2s'}}>
                            <span style={{width:20,height:20,borderRadius:'50%',background:dark?'#2a2a2a':'#e5e7eb',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0,color:dark?'#9ca3af':'#6b7280'}}>
                              {letters[i]}
                            </span>
                            <span>{a}</span>
                          </button>
                        );
                      })}
                    </div>
                    {dailyChallengeResult && (
                      <div className="slide-up" style={{marginTop:10,padding:'10px 12px',borderRadius:12,fontSize:12,lineHeight:1.6,
                        background:dailyChallengeResult.isCorrect?(dark?'#064e3b':'#f0fdf4'):(dark?'#450a0a':'#fff1f2'),
                        border:`1px solid ${dailyChallengeResult.isCorrect?(dark?'#059669':'#6ee7b7'):(dark?'#b91c1c':'#fca5a5')}`,
                        color:dailyChallengeResult.isCorrect?(dark?'#a7f3d0':'#065f46'):(dark?'#fca5a5':'#9f1239')}}>
                        <strong>{dailyChallengeResult.isCorrect?(t.home?.ok||'✅ Bonne réponse ! +20 XP'):(t.home?.nok||'❌ Pas tout à fait… +5 XP')}</strong>
                        <div style={{marginTop:4,opacity:0.9}}>{dailyChallengeResult.explanation}</div>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          );
        })()}

        {/* Roadmaps */}
        <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', padding:'0 16px', marginBottom:8}}>
          {t.home?.roadmaps||'ROADMAPS DISPONIBLES'}
        </div>
        <div style={{padding:'0 16px 20px', display:'flex', flexDirection:'column', gap:8}}>
          {(tRoadmaps || ROADMAPS).map(rm => {
            let total = 0; rm.sections.forEach(s => total += s.levels.length);
            const done = (state.done[rm.id]||[]).length;
            const pct = total ? Math.round((done/total)*100) : 0;
            const progColors = {frontend:'#3b82f6',backend:'#10b981',devops:'#f59e0b',ai:'#8b5cf6',fullstack:'#ec4899',sql:'#78716c'};
            const prog = progColors[rm.id] || '#3b82f6';
            return (
              <button key={rm.id} onClick={()=>{setCurRM(rm.id);setScreen("levels");}}
                className="card-hover"
                style={{
                  width:'100%', background: dark?'#161616':'#ffffff',
                  border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`,
                  borderRadius:16, padding:'12px 14px',
                  display:'flex', alignItems:'center', gap:12,
                  textAlign:'left', cursor:'pointer', boxShadow: dark?'none':'0 1px 4px rgba(0,0,0,0.04)'
                }}>
                <div style={{
                  width:44, height:44, borderRadius:14, flexShrink:0,
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:22,
                  background: dark?'#0f0f0f':'#f9fafb',
                  border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`
                }}>{rm.icon}</div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
                    <span style={{fontSize:14, fontWeight:600, color: dark?'#f9fafb':'#111827', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{rm.name}</span>
                    {rm.badge && <span style={{fontSize:10, fontWeight:600, padding:'2px 7px', borderRadius:99, background:'#eff6ff', color:'#1d4ed8'}}>{(RM_BADGE_TRANS[lang]||RM_BADGE_TRANS.fr)[rm.badge]||rm.badge}</span>}
                  </div>
                  <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', marginBottom:5}}>{done}/{total} {(L_PROFILE[lang]||L_PROFILE.fr).levels.toLowerCase()}</div>
                  <div style={{height:4, background: dark?'#2a2a2a':'#f3f4f6', borderRadius:99, overflow:'hidden'}}>
                    <div className="progress-bar" style={{height:'100%', borderRadius:99, background:prog, width:`${pct}%`}}/>
                  </div>
                </div>
                <ChevronRight size={16} style={{color: dark?'#4b5563':'#d1d5db', flexShrink:0}}/>
              </button>
            );
          })}
        </div>
      </div>
      <BottomNav active="home"/>
    </PhoneFrame>
  );

  // ── Classement ────────────────────────────────────────────────────────────
  if (screen === "lb") {
    const lb = LB_INIT.map(u => u.isYou ? {...u, xp:state.xp, n:username, av:avatarLetter} : u);
    const sorted = [...lb].sort((a,b)=>b.xp-a.xp);
    const rankEmoji = ["🥇","🥈","🥉"];
    const rankBg = ['linear-gradient(135deg,#fef3c7,#fde68a)','linear-gradient(135deg,#f3f4f6,#e5e7eb)','linear-gradient(135deg,#fed7aa,#fdba74)'];
    return (
      <PhoneFrame>
        <div style={{padding:'14px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0, borderBottom:`1px solid ${dark?'#1c1c1f':'#f0f0f5'}`}}>
          <div style={{fontSize:19, fontWeight:800, letterSpacing:-0.5, color: dark?'#fafafa':'#0f172a'}}>🏆 {t.nav?.lb||'Classement'}</div>
        </div>
        <div style={{flex:1, overflowY:'auto', padding:'12px 16px 16px'}}>
          {sorted.map((u,i) => (
            <div key={i} style={{
              display:'flex', alignItems:'center', gap:10,
              padding:'10px 12px', borderRadius:16, marginBottom:7,
              background: u.isYou ? (dark?'rgba(99,102,241,0.12)':'#eef2ff') : (dark?'#18181b':'#f8f8fd'),
              border:`1px solid ${u.isYou?(dark?'rgba(99,102,241,0.35)':'#c7d2fe'):(dark?'#27272a':'#eef0f5')}`,
              boxShadow: u.isYou?(dark?'0 2px 12px rgba(99,102,241,0.12)':'0 2px 12px rgba(99,102,241,0.06)'):'none',
              transition:'all 0.15s'
            }}>
              <div style={{width:28, textAlign:'center', fontSize:i<3?18:13, fontWeight:700, color: dark?'#a1a1aa':'#64748b'}}>
                {i < 3 ? rankEmoji[i] : i+1}
              </div>
              <div style={{
                width:36, height:36, borderRadius:'50%', flexShrink:0,
                background: i<3 ? rankBg[i] : (dark?'#27272a':'#e8eaf0'),
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:13, fontWeight:700, color: dark?'#fafafa':'#374151'
              }}>{u.av}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14, fontWeight:u.isYou?700:500, color: dark?'#fafafa':'#0f172a'}}>{u.n}</div>
                {u.isYou && <div style={{fontSize:11, color:'#6366f1', fontWeight:700}}>• {t.home?.you||'Toi'}</div>}
              </div>
              <div style={{fontSize:13, fontWeight:800, color: dark?'#818cf8':'#6366f1'}}>{u.xp} XP</div>
            </div>
          ))}
        </div>
        <BottomNav active="lb"/>
      </PhoneFrame>
    );
  }

  // ── Badges ────────────────────────────────────────────────────────────────
  if (screen === "badges") {
    const earnedCount = BADGES.filter(b=>b.check(state)).length;
    return (
      <PhoneFrame>
        <div style={{padding:'14px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0, borderBottom:`1px solid ${dark?'#1c1c1f':'#f0f0f5'}`}}>
          <div>
            <div style={{fontSize:19, fontWeight:800, letterSpacing:-0.5, color: dark?'#fafafa':'#0f172a'}}>{(L_BADGES[lang]||L_BADGES.fr).title}</div>
            <div style={{fontSize:12, color: dark?'#52525b':'#94a3b8', fontWeight:600}}>
              {earnedCount}/{BADGES.length} {(L_BADGES[lang]||L_BADGES.fr).count}
            </div>
          </div>
        </div>
        <div style={{flex:1, overflowY:'auto'}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, padding:'12px 16px 20px'}}>
            {BADGES.map((b,i)=>{
              const ok = b.check(state);
              const bt = (BADGE_TRANS[lang]||BADGE_TRANS.fr)[i]||{n:b.name,d:b.desc};
              return (
                <div key={i} className={ok?'bounce-in':''} style={{
                  border:`1.5px solid ${ok?(dark?'rgba(52,211,153,0.4)':'#6ee7b7'):(dark?'#27272a':'#e8eaf0')}`,
                  borderRadius:18, padding:'16px 10px', textAlign:'center',
                  background: ok?(dark?'rgba(5,150,105,0.1)':'#ecfdf5'):(dark?'#18181b':'#f8f8fd'),
                  opacity: ok?1:0.38,
                  transition:'all 0.2s',
                  boxShadow: ok?(dark?'0 4px 16px rgba(52,211,153,0.1)':'0 4px 16px rgba(5,150,105,0.06)'):'none'
                }}>
