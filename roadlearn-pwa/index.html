  "ml-concepts": {
    theory: "Le Machine Learning (ML) est un sous-domaine de l'IA où les algorithmes apprennent à partir de données. Apprentissage supervisé : on fournit des données labellisées (X → Y). Exemple : prédire le prix d'une maison à partir de sa surface. Non-supervisé : trouver des structures dans des données sans labels (clustering). Par renforcement : un agent apprend par essai-erreur avec des récompenses. Le dataset se divise en entraînement (80%) et test (20%). L'overfitting survient quand le modèle mémorise au lieu de généraliser.",
    questions: [
      { q: "Qu'est-ce que l'apprentissage supervisé ?", answers: ["Un humain supervise chaque prédiction", "Entraîner un modèle sur des paires (entrée, sortie attendue) connues", "Un modèle qui apprend par essai-erreur", "Trouver des patterns dans des données sans labels"], correct: 1, explanation: "Supervisé = données labellisées. Exemples : classification (spam/non-spam), régression (prédire un prix).", difficulty: 1 },
      { q: "Qu'est-ce que l'overfitting ?", answers: ["Un modèle qui apprend trop vite", "Un modèle qui performe bien en entraînement mais mal sur de nouvelles données", "Un manque de données d'entraînement", "Un modèle trop simple"], correct: 1, explanation: "L'overfitting : le modèle mémorise le bruit du training set. Remèdes : plus de données, régularisation (L1/L2), dropout, cross-validation.", difficulty: 2 },
      { q: "Pourquoi sépare-t-on les données en training set et test set ?", answers: ["Pour aller plus vite à l'entraînement", "Pour évaluer si le modèle généralise sur des données non vues", "Pour économiser de la mémoire", "Parce que les algorithmes l'exigent"], correct: 1, explanation: "Le test set simule des données réelles inconnues. Si on évaluait sur le training set, on mesurerait la mémorisation, pas la généralisation.", difficulty: 2 },
      { q: "Qu'est-ce qu'une feature en Machine Learning ?", answers: ["Une fonctionnalité logicielle", "Une variable d'entrée utilisée pour faire des prédictions", "Le résultat d'une prédiction", "Un hyperparamètre du modèle"], correct: 1, explanation: "Features = variables d'entrée (surface, nombre de pièces pour prédire un prix). Label = valeur à prédire (le prix).", difficulty: 1 },
      { q: "Quelle métrique mesure le pourcentage de prédictions correctes d'un classifieur ?", answers: ["Précision (precision)", "Rappel (recall)", "Exactitude (accuracy)", "F1-score"], correct: 2, explanation: "Accuracy = (prédictions correctes) / (total). Mais attention aux datasets déséquilibrés — préférer precision/recall/F1.", difficulty: 3 },

  llm: {
    theory: "Les LLMs (Large Language Models) sont des modèles de Deep Learning entraînés sur d'immenses corpus de texte. Ils prédisent le token suivant basé sur le contexte précédent. L'architecture Transformer (attention mechanism) est à la base de GPT, Claude, Gemini. Le pré-entraînement apprend le langage en général. Le fine-tuning adapte le modèle à une tâche spécifique. Le RLHF (Reinforcement Learning from Human Feedback) aligne le comportement du modèle avec les préférences humaines.",
    questions: [

      { q: "Quelle architecture est à la base de tous les LLMs modernes (GPT, Claude, Gemini) ?", answers: ["CNN (réseaux convolutifs)", "RNN (réseaux récurrents)", "Transformer (avec attention)", "SVM (machines à vecteurs de support)"], correct: 2, explanation: "Le Transformer (2017, 'Attention Is All You Need') utilise l'auto-attention pour capturer les relations entre tous les tokens simultanément.", difficulty: 2 },
      { q: "Qu'est-ce que le fine-tuning d'un LLM ?", answers: ["Comprimer le modèle pour qu'il soit plus rapide", "Continuer l'entraînement sur des données spécifiques à une tâche pour adapter le modèle", "Supprimer des couches du modèle", "Convertir le modèle en un autre format"], correct: 1, explanation: "Le fine-tuning prend un modèle pré-entraîné et l'entraîne davantage sur des données spécifiques (ex: service client, code médical).", difficulty: 2 },
      { q: "Qu'est-ce que le contexte (context window) d'un LLM ?", answers: ["La mémoire permanente du modèle", "La quantité maximale de texte (tokens) que le modèle peut traiter en une seule fois", "La fenêtre d'interface du chatbot", "Le nombre de paramètres du modèle"], correct: 1, explanation: "La context window limite combien de texte le modèle 'voit' simultanément. 128K tokens = ~100 000 mots environ.", difficulty: 3 },

  "prompt-eng": {
    theory: "Le prompt engineering est l'art d'écrire des instructions efficaces pour guider les LLMs. Techniques clés : être spécifique et précis, donner du contexte, spécifier le format de sortie, utiliser des exemples (few-shot prompting), utiliser la chaîne de pensée (chain-of-thought : 'pense étape par étape'). System prompt définit le comportement global. Role prompting : 'Tu es un expert en...'. Temperature contrôle la créativité (0 = déterministe, 1 = créatif).",
    questions: [
      { q: "Qu'est-ce que le few-shot prompting ?", answers: ["Faire plusieurs essais jusqu'à obtenir une bonne réponse", "Fournir des exemples d'entrée/sortie dans le prompt pour guider le modèle", "Utiliser plusieurs modèles simultanément", "Réduire la longueur du prompt"], correct: 1, explanation: "Few-shot : montrer 2-5 exemples (input → output) dans le prompt. Le modèle comprend le pattern et l'applique à la nouvelle entrée.", difficulty: 1 },
      { q: "Que fait la technique 'Chain of Thought' (chaîne de pensée) ?", answers: ["Enchaîner plusieurs modèles en série", "Demander au modèle de raisonner étape par étape pour améliorer la précision", "Chaîner plusieurs prompts automatiquement", "Utiliser l'historique de conversation"], correct: 1, explanation: "'Pense étape par étape' ou 'Résous ce problème en décomposant les étapes' améliore significativement les raisonnements complexes.", difficulty: 2 },
      { q: "Que contrôle le paramètre temperature d'un LLM ?", answers: ["La vitesse de génération", "Le niveau de créativité/aléatoire des réponses (0 = déterministe, élevé = créatif)", "La longueur maximale de la réponse", "Le nombre de tokens d'entrée"], correct: 1, explanation: "Temperature 0 = toujours le token le plus probable (déterministe). Valeur élevée = plus de variété et créativité, moins de fiabilité.", difficulty: 2 },
      { q: "Qu'est-ce qu'un system prompt ?", answers: ["Le premier message de l'utilisateur", "Des instructions de haut niveau définissant le comportement du modèle pour toute la conversation", "Un prompt optimisé par l'IA", "Le prompt par défaut du modèle"], correct: 1, explanation: "Le system prompt configure le personnage, les règles et le contexte du modèle avant la conversation. Il n'est généralement pas visible par l'utilisateur.", difficulty: 2 },
    ],

  rag: {
    theory: "RAG (Retrieval-Augmented Generation) combine les LLMs avec une base de connaissances externe. Problème résolu : les LLMs ont une date de coupure et hallucinent des faits. Fonctionnement : (1) Indexer des documents en embeddings vectoriels dans une vector database (Pinecone, Weaviate). (2) À chaque question, chercher les passages les plus similaires (similarité cosinus). (3) Injecter ces passages dans le prompt du LLM. Le LLM répond en s'appuyant sur les données récupérées.",
    questions: [
      { q: "Quel problème des LLMs le RAG cherche-t-il à résoudre ?", answers: ["La lenteur de génération", "Le manque de connaissances récentes et les hallucinations factuelles", "Le coût d'entraînement", "La longueur des réponses"], correct: 1, explanation: "Les LLMs ont une date de coupure et inventent parfois des faits (hallucinations). RAG ancre les réponses dans des documents réels et à jour.", difficulty: 1 },
      { q: "Qu'est-ce qu'un embedding vectoriel dans le contexte du RAG ?", answers: ["Un format de compression de données", "Une représentation numérique du sens d'un texte dans un espace vectoriel", "Un type de base de données spéciale", "Un modèle de ML simplifié"], correct: 1, explanation: "L'embedding convertit un texte en vecteur de nombres. Des textes similaires ont des vecteurs proches. Permet la recherche sémantique.", difficulty: 2 },
      { q: "Quelle mesure est utilisée pour trouver les documents les plus pertinents dans une vector DB ?", answers: ["Distance Euclidienne uniquement", "Similarité cosinus entre vecteurs", "Longueur du document", "Date de création du document"], correct: 1, explanation: "La similarité cosinus mesure l'angle entre deux vecteurs. Angle petit = textes très similaires sémantiquement.", difficulty: 3 },
      { q: "Dans quel ordre les étapes RAG s'exécutent-elles lors d'une question ?", answers: ["LLM → Retrieval → Réponse", "Retrieval → Augmentation du prompt → LLM génère la réponse", "LLM → Indexation → Retrieval", "Question → LLM → Vector DB"], correct: 1, explanation: "1) Convertir la question en embedding. 2) Chercher les passages similaires. 3) Ajouter les passages au prompt. 4) LLM génère avec contexte.", difficulty: 2 },
    ],
  },
  pwa: {
    theory: "Une Progressive Web App (PWA) est une application web qui s'installe comme une app native. Trois piliers : Service Worker (cache offline, push notifications), Web App Manifest (icône, nom, display:standalone), HTTPS (obligatoire). Le Service Worker est un script JS qui tourne en arrière-plan. Cache-first : sert le cache si disponible. Network-first : essaie le réseau, fallback sur le cache. Les PWA combinent la portée du web et l'expérience d'une app native.",
    questions: [

      { q: "Que fait un Service Worker ?", answers: ["Améliore les performances CSS", "Un script JS en arrière-plan qui intercepte les requêtes réseau et gère le cache", "Un worker thread pour les calculs", "Un service de push marketing"], correct: 1, explanation: "Le Service Worker intercepte fetch(), peut répondre depuis le cache et fonctionne même hors ligne. S'enregistre via navigator.serviceWorker.register().", difficulty: 2 },
      { q: "Quelle stratégie de cache sert d'abord le cache, puis met à jour en arrière-plan ?", answers: ["Network-first", "Cache-only", "Stale-While-Revalidate", "Network-only"], correct: 2, explanation: "Stale-While-Revalidate sert immédiatement le cache (rapide), puis met à jour le cache depuis le réseau pour la prochaine fois.", difficulty: 3 },
      { q: "Que contient le fichier manifest.json d'une PWA ?", answers: ["Le code JavaScript de l'app", "Les métadonnées : nom, icônes, couleurs, display mode pour l'installation", "La configuration du Service Worker", "Les routes de l'application"], correct: 1, explanation: "manifest.json : name, short_name, icons, start_url, display (standalone/fullscreen), theme_color, background_color.", difficulty: 2 },

  performance: {
    theory: "L'optimisation des performances web améliore l'expérience utilisateur et le SEO. Core Web Vitals de Google : LCP (Largest Contentful Paint < 2.5s), FID/INP (interaction < 200ms), CLS (Cumulative Layout Shift < 0.1). Techniques : lazy loading des images (loading='lazy'), code splitting (import() dynamique), minification/compression (gzip/brotli), CDN pour les assets statiques. En React : React.memo, useMemo, useCallback évitent les re-renders inutiles. Le profiler Chrome DevTools aide à identifier les goulots d'étranglement.",
    questions: [
      { q: "Qu'est-ce que le lazy loading des images ?", answers: ["Charger toutes les images en avance", "Ne charger une image que lorsqu'elle entre dans la zone visible", "Compresser les images automatiquement", "Charger les images en basse résolution d'abord"], correct: 1, explanation: "loading='lazy' sur <img> charge l'image seulement quand elle approche du viewport. Réduit le temps de chargement initial.", difficulty: 1 },
      { q: "Que signifie LCP dans les Core Web Vitals de Google ?", answers: ["Lowest Content Performance", "Largest Contentful Paint — temps d'affichage du plus grand élément visible", "Longest Code Path", "Last Cached Page"], correct: 1, explanation: "LCP mesure le temps d'affichage du plus grand élément (image/texte) visible. Cible : < 2.5 secondes pour une bonne expérience.", difficulty: 2 },
      { q: "Qu'est-ce que le code splitting en JavaScript ?", answers: ["Diviser le CSS en plusieurs fichiers", "Diviser le bundle JS en morceaux chargés à la demande", "Répartir le code entre plusieurs serveurs", "Minifier le code en plusieurs passes"], correct: 1, explanation: "Le code splitting charge seulement le JS nécessaire pour la page courante. import() dynamique et React.lazy() permettent de le faire.", difficulty: 2 },
      { q: "À quoi sert React.memo() ?", answers: ["Mémoïser les valeurs calculées coûteuses", "Empêcher un composant de se re-rendre si ses props n'ont pas changé", "Mettre en cache les appels API", "Optimiser les animations CSS"], correct: 1, explanation: "React.memo() enveloppe un composant et le re-rend seulement si ses props changent. Utiliser avec useMemo/useCallback pour les props complexes.", difficulty: 3 },

  accessibility: {

      { q: "Qu'est-ce que les attributs ARIA et quand les utiliser ?", answers: ["Des styles CSS spéciaux pour l'accessibilité", "Des attributs qui ajoutent de la sémantique aux éléments HTML quand le HTML natif ne suffit pas", "Des balises HTML alternatives aux éléments standard", "Des scripts pour les lecteurs d'écran"], correct: 1, explanation: "ARIA (Accessible Rich Internet Applications) comme aria-label, aria-expanded, role complètent le HTML pour les widgets complexes. Règle : toujours préférer le HTML sémantique natif.", difficulty: 3 },

  "design-patterns": {
    theory: "Les design patterns sont des solutions réutilisables à des problèmes récurrents. Catégories : Créationnels (Singleton, Factory, Builder), Structurels (Adapter, Decorator, Proxy), Comportementaux (Observer, Strategy, Command). Singleton : une seule instance globale. Factory : crée des objets sans exposer la logique de création. Observer : notification automatique des dépendants (event emitter). Strategy : algorithme interchangeable. Ces patterns améliorent la maintenabilité et testabilité du code.",
    questions: [
      { q: "Qu'est-ce que le pattern Singleton ?", answers: ["Créer une instance d'objet par fichier", "Garantir qu'une classe n'a qu'une seule instance globale", "Un composant React sans state", "Un module ES6 sans export default"], correct: 1, explanation: "Singleton : une seule instance partagée. Utile pour les connexions DB, les loggers, les stores globaux. Attention aux tests difficiles.", difficulty: 2 },
      { q: "Quel pattern permet de notifier automatiquement des abonnés quand un état change ?", answers: ["Factory", "Singleton", "Observer", "Adapter"], correct: 2, explanation: "Observer (aussi appelé Pub/Sub) : les subscribers s'enregistrent, l'objet observable les notifie au changement. Utilisé dans EventEmitter, useState, RxJS.", difficulty: 2 },
      { q: "Qu'est-ce que le pattern Strategy ?", answers: ["Choisir aléatoirement un algorithme", "Définir une famille d'algorithmes interchangeables selon le contexte", "Une stratégie de tests", "La sélection du framework à utiliser"], correct: 1, explanation: "Strategy : l'algorithme est encapsulé et peut être changé à l'exécution. Ex: différents algorithmes de tri, de paiement, d'authentification.", difficulty: 3 },
      { q: "Quel pattern ajoute des fonctionnalités à un objet sans modifier sa classe ?", answers: ["Singleton", "Factory", "Observer", "Decorator"], correct: 3, explanation: "Decorator enveloppe un objet et ajoute des comportements. Ex: middleware Express, les HOC (Higher-Order Components) React.", difficulty: 3 },

  "monolith-microservices": {
    theory: "Un monolithe est une application où tous les modules sont déployés ensemble. Simple à développer et déboguer au départ. Les microservices décomposent l'app en petits services indépendants, chacun avec sa base de données, son API et son déploiement. Avantages microservices : scalabilité indépendante, technologies mixtes, résilience. Inconvénients : complexité réseau, transactions distribuées, observabilité. La règle : commencer monolithique, migrer vers les microservices quand la complexité organisationnelle le justifie.",
    questions: [
      { q: "Quel est l'avantage principal d'une architecture monolithique pour une startup ?", answers: ["Scalabilité infinie", "Simplicité de développement, déploiement et débogage en phase initiale", "Meilleure résistance aux pannes", "Facilité de migration vers le cloud"], correct: 1, explanation: "Un monolithe est plus simple à développer, tester et déployer. La complexité des microservices est injustifiée pour une petite équipe.", difficulty: 1 },
      { q: "Qu'est-ce qui caractérise les microservices par rapport aux monolithes ?", answers: ["Plus petits fichiers de code", "Services indépendants avec bases de données séparées, déployés séparément", "Une seule API pour toute l'application", "Un seul serveur pour tous les services"], correct: 1, explanation: "Chaque microservice a son propre domaine, sa DB, et peut être déployé et scalé indépendamment des autres services.", difficulty: 2 },
      { q: "Quel problème des microservices n'existe pas dans un monolithe ?", answers: ["Le débogage des erreurs", "Les transactions distribuées et la cohérence des données entre services", "La lenteur du développement", "L'utilisation de plusieurs langages"], correct: 1, explanation: "Dans un monolithe, une transaction DB est simple. Dans les microservices, coordonner une transaction sur 3 services (Saga pattern) est complexe.", difficulty: 3 },
      { q: "Quel composant coordonne la communication entre microservices dans les APIs HTTP ?", answers: ["Load Balancer", "API Gateway", "Message Queue", "Service Mesh"], correct: 1, explanation: "L'API Gateway est le point d'entrée unique. Il route les requêtes, gère l'authentification, le rate limiting et agrège les réponses.", difficulty: 3 },

  "sql-advanced": {
    theory: "Les sous-requêtes sont des SELECT imbriqués dans une autre requête. Une sous-requête scalaire retourne une valeur : WHERE salaire > (SELECT AVG(salaire) FROM employes). Les fonctions de fenêtrage (window functions) calculent sur un ensemble de lignes sans les regrouper : ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salaire). Les CTE (Common Table Expressions) avec WITH rendent les requêtes complexes lisibles. Les index accélèrent les recherches mais ralentissent les écritures.",
    questions: [
      { q: "Qu'est-ce qu'une sous-requête en SQL ?", answers: ["Une requête stockée en base de données", "Un SELECT imbriqué dans une autre requête SQL", "Une vue SQL", "Une procédure stockée"], correct: 1, explanation: "Une sous-requête s'exécute d'abord. Exemple : WHERE id IN (SELECT user_id FROM orders WHERE total > 100).", difficulty: 2 },
      { q: "Que fait la fonction ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salaire DESC) ?", answers: ["Compte les employés par département", "Attribue un numéro de ligne dans chaque département, trié par salaire décroissant", "Trie les résultats finaux", "Crée un index partitionné"], correct: 1, explanation: "ROW_NUMBER() est une window function. PARTITION BY recrée les numéros à chaque groupe. ORDER BY définit l'ordre du numérotage.", difficulty: 3 },
      { q: "Qu'est-ce qu'un CTE (Common Table Expression) en SQL ?", answers: ["Un index optimisé", "Un résultat intermédiaire nommé défini avec WITH, réutilisable dans la requête principale", "Une table temporaire permanente", "Une procédure stockée simplifiée"], correct: 1, explanation: "WITH ma_cte AS (SELECT ...) SELECT * FROM ma_cte. Rend les requêtes complexes lisibles. Ne persiste pas après la requête.", difficulty: 3 },
      { q: "Pourquoi un index améliore-t-il les performances des SELECT mais peut ralentir les INSERT/UPDATE ?", answers: ["Les index suppriment automatiquement les doublons", "L'index doit être mis à jour à chaque écriture, ce qui ajoute une opération", "Les index consomment de la RAM uniquement", "Les index désactivent les contraintes d'intégrité"], correct: 1, explanation: "Un index est une structure de données séparée à maintenir. Plus d'index = lectures plus rapides mais écritures plus coûteuses.", difficulty: 3 },
    ],

  http: {
    theory: "HTTP (HyperText Transfer Protocol) est le protocole de communication du web. Modèle requête-réponse : le client envoie une requête, le serveur retourne une réponse. Méthodes : GET (récupérer), POST (créer), PUT (remplacer entièrement), PATCH (modifier partiellement), DELETE (supprimer). Codes de statut : 200 OK, 201 Créé, 301/302 Redirection, 400 Mauvaise requête, 401 Non authentifié, 403 Interdit, 404 Non trouvé, 500 Erreur serveur. HTTPS = HTTP + TLS : les données sont chiffrées en transit via un certificat SSL.",
    questions: [

      { q: "Que signifie le code de statut HTTP 404 ?", answers: ["Succès de la requête", "Redirection permanente", "Ressource non trouvée", "Erreur serveur interne"], correct: 2, explanation: "404 Not Found : la ressource demandée n'existe pas sur ce serveur. 200 = succès, 500 = erreur serveur, 301 = redirection permanente.", difficulty: 1 },

      { q: "Quelle différence entre les codes HTTP 401 et 403 ?", answers: ["Aucune différence", "401 = non authentifié (pas connecté), 403 = non autorisé (connecté mais sans permission)", "401 = erreur client, 403 = erreur serveur", "401 = introuvable, 403 = service indisponible"], correct: 1, explanation: "401 Unauthorized : vous n'êtes pas connecté, fournissez des credentials. 403 Forbidden : vous êtes connecté mais n'avez pas la permission.", difficulty: 2 },
      { q: "Pourquoi HTTPS est-il obligatoire pour les sites en production ?", answers: ["Pour accélérer le chargement uniquement", "Pour chiffrer les données en transit et authentifier le serveur via TLS", "Pour améliorer uniquement le SEO", "Pour supporter les cookies de session"], correct: 1, explanation: "HTTPS chiffre la communication : mots de passe et données bancaires ne peuvent être interceptés. Obligatoire pour les PWA et Service Workers.", difficulty: 1 },

  "rest-api": {
    theory: "REST (Representational State Transfer) est un style d'architecture pour concevoir des APIs web. Principes clés : stateless (chaque requête est indépendante, sans état côté serveur), ressources identifiées par des URLs (/users, /users/1), manipulation via les méthodes HTTP standard. Convention RESTful : GET /users (liste), GET /users/:id (un seul), POST /users (créer), PUT /users/:id (modifier), DELETE /users/:id (supprimer). Format de réponse standard : JSON. Une API REST découple totalement le frontend du backend.",
    questions: [
      { q: "Quelle URL RESTful récupère la liste de tous les articles ?", answers: ["/article/all", "/articles", "/getArticles", "/article?mode=list"], correct: 1, explanation: "En REST, les ressources sont au pluriel (/articles). GET /articles = liste complète, GET /articles/1 = un seul article.", difficulty: 1 },
      { q: "Qu'est-ce que 'stateless' dans une API REST ?", answers: ["L'API n'a pas de variables d'état JS", "Chaque requête contient toutes les informations nécessaires — le serveur ne stocke pas la session", "L'API n'utilise pas de base de données", "L'API retourne toujours le même résultat"], correct: 1, explanation: "Stateless : le serveur ne se souvient pas des requêtes précédentes. L'authentification se fait via un token JWT envoyé à chaque requête.", difficulty: 2 },
      { q: "Quelle méthode HTTP et URL créent un nouvel utilisateur en REST ?", answers: ["GET /users/new", "POST /users", "CREATE /users", "PUT /users/new"], correct: 1, explanation: "POST /users envoie les données dans le corps de la requête. Le serveur crée la ressource et retourne généralement un 201 Created.", difficulty: 1 },
      { q: "Que signifie CRUD dans le contexte des APIs REST ?", answers: ["Code, Run, Update, Deploy", "Create, Read, Update, Delete — les 4 opérations fondamentales sur les données", "Connect, Route, Understand, Deliver", "Cache, Respond, Undo, Deploy"], correct: 1, explanation: "CRUD = Create (POST), Read (GET), Update (PUT/PATCH), Delete (DELETE). Ces 4 opérations couvrent toutes les interactions avec les données.", difficulty: 1 },
      { q: "Quel format est universellement utilisé dans les réponses d'APIs REST modernes ?", answers: ["XML uniquement", "HTML", "JSON", "CSV"], correct: 2, explanation: "JSON (JavaScript Object Notation) est léger, lisible et natif en JavaScript. Quasiment toutes les APIs modernes retournent du JSON.", difficulty: 1 },

  orm: {
    theory: "Un ORM (Object-Relational Mapper) fait le pont entre les objets JavaScript et les tables SQL. Avantages : pas de SQL brut, protection automatique contre les injections SQL, migrations de schéma versionnées. Prisma est l'ORM moderne pour Node.js : on définit les modèles dans schema.prisma, Prisma génère un client TypeScript entièrement typé. prisma.user.findMany() = SELECT * FROM users. prisma.user.create({data:{...}}) = INSERT INTO users. Sequelize est l'ORM classique avec une API chainée.",
    questions: [
      { q: "Quel est l'avantage principal d'un ORM par rapport au SQL brut ?", answers: ["Toujours plus rapide qu'une requête SQL directe", "Abstraction objet, protection SQL injection, productivité et migrations versionées", "Il supporte uniquement MySQL", "Il génère automatiquement des interfaces React"], correct: 1, explanation: "L'ORM génère des requêtes paramétrées (protection injection SQL), offre une API objet intuitive et gère les migrations de schéma.", difficulty: 1 },
      { q: "Quelle méthode Prisma est équivalente à SELECT * FROM users WHERE active = true ?", answers: ["prisma.users.selectAll({active: true})", "prisma.user.findMany({ where: { active: true } })", "prisma.user.query('active=true')", "prisma.user.getAll({ filter: 'active' })"], correct: 1, explanation: "findMany() avec where est l'équivalent Prisma d'un SELECT ... WHERE. Le client est entièrement typé TypeScript.", difficulty: 2 },
      { q: "Que fait la commande 'npx prisma migrate dev' ?", answers: ["Démarre un serveur de développement Prisma", "Génère et applique les migrations SQL, puis régénère le client Prisma", "Réinitialise entièrement la base de données", "Installe Prisma dans le projet"], correct: 1, explanation: "prisma migrate dev compare le schéma et la DB, génère un fichier SQL de migration, l'applique et régénère le client typé.", difficulty: 3 },
      { q: "Comment créer un enregistrement avec Prisma ?", answers: ["prisma.user.insert({...})", "prisma.user.create({ data: { name: 'Alice', email: 'a@b.com' } })", "prisma.user.save({...})", "prisma.users.add({...})"], correct: 1, explanation: "create({ data: {...} }) insère un enregistrement et retourne l'objet créé avec son id généré. Équivalent de INSERT INTO.", difficulty: 2 },
      { q: "Pourquoi un ORM protège-t-il contre les injections SQL ?", answers: ["Il valide le JavaScript avant l'exécution", "Il utilise des requêtes paramétrées — les données sont séparées du code SQL", "Il chiffre toutes les requêtes", "Il interdit les requêtes dynamiques"], correct: 1, explanation: "Les requêtes paramétrées séparent le code SQL des données. Même si un attaquant injecte du SQL dans les données, la structure de la requête ne peut être modifiée.", difficulty: 2 },

  queues: {
    theory: "Les files de messages (message queues) permettent le traitement asynchrone de tâches longues. Problème résolu : ne pas bloquer la réponse HTTP pendant un traitement lourd (envoi d'email, redimensionnement d'image, génération PDF). Bull/BullMQ est la bibliothèque Node.js la plus populaire, basée sur Redis. Workflow : 1) Le serveur ajoute un job à la queue. 2) Un worker consomme et traite le job indépendamment. Avantages : retry automatique, plusieurs workers en parallèle, découplage des services.",
    questions: [
      { q: "Pourquoi utilise-t-on une queue pour l'envoi d'emails ?", answers: ["Les emails sont synchrones par nature", "Pour ne pas bloquer la réponse HTTP — l'email est traité en arrière-plan par un worker", "Les emails sont trop volumineux pour HTTP", "Pour mémoriser l'historique des emails envoyés"], correct: 1, explanation: "Envoyer un email peut prendre 1-2 secondes. Avec une queue, la réponse est immédiate et le worker envoie l'email de façon asynchrone.", difficulty: 2 },
      { q: "Quel est le rôle d'un 'worker' dans une architecture queue ?", answers: ["Il initialise et configure la file de messages", "Il consomme et traite les jobs de la queue indépendamment du serveur principal", "Il stocke les jobs en base de données SQL", "Il orchestre la communication entre microservices"], correct: 1, explanation: "Le worker est un processus séparé qui écoute la queue et exécute les jobs. On peut démarrer plusieurs workers en parallèle pour scaler.", difficulty: 1 },
      { q: "Quel service de stockage Bull/BullMQ utilise-t-il comme backend ?", answers: ["PostgreSQL", "MongoDB", "Redis", "RabbitMQ"], correct: 2, explanation: "Bull/BullMQ stocke les jobs dans Redis. Sa rapidité en mémoire est idéale pour une queue haute performance.", difficulty: 2 },
      { q: "Qu'est-ce que le 'retry' automatique dans une queue ?", answers: ["Réessayer la même requête HTTP côté client", "Re-traiter automatiquement un job échoué après un délai configurable", "Dupliquer les jobs pour redondance", "Annuler et supprimer un job en échec"], correct: 1, explanation: "BullMQ peut configurer le nombre de tentatives et le délai (backoff). Si un service externe est temporairement down, le job sera retenté automatiquement.", difficulty: 2 },
      { q: "Quel est le principal bénéfice de traiter les tâches lourdes via une queue ?", answers: ["Réduire le nombre de lignes de code", "L'utilisateur reçoit une réponse rapide et les tâches longues se traitent en arrière-plan", "Éviter d'utiliser une base de données", "Simplifier l'architecture à un seul serveur"], correct: 1, explanation: "L'utilisateur n'attend pas : la réponse HTTP est immédiate. Le traitement lourd (image, PDF) se fait en arrière-plan sans timeout.", difficulty: 1 },

function detectTopicKey(levelName) {
  const n = levelName.toLowerCase();

  // ── HTTP / Protocoles réseau ──
  if (n.includes("http") && (n.includes("protocole") || n.includes("web") || n.includes("réseau") || n.includes("réseau"))) return "http";

  // ── HTML ──
  if (n.includes("html") && (n.includes("formulaire") || n.includes("média") || n.includes("media") || n.includes("form"))) return "html-forms";
  if (n.includes("html")) return "html";

  // ── CSS ──
  if (n.includes("flexbox") || (n.includes("css") && n.includes("flex"))) return "flexbox";
  if (n.includes("grid") && (n.includes("css") || n.includes("layout") || n.includes("grille"))) return "grid";
  if (n.includes("responsive") || n.includes("media quer") || n.includes("media-quer")) return "css-responsive";
  if (n.includes("css")) return "css";

  // ── JavaScript ──
  if (n.includes("dom") || n.includes("manipulation")) return "dom";
  if ((n.includes("event") || n.includes("événement")) && !n.includes("loop")) return "js-events";
  if (n.includes("api") && n.includes("rest") && !n.includes("fetch")) return "rest-api";
  if (n.includes("fetch") || (n.includes("api") && n.includes("rest"))) return "js-fetch";
  if (n.includes("promise") || n.includes("async") || n.includes("await")) return "async";
  if (n.includes("module") && (n.includes("es") || n.includes("js"))) return "js-modules";
  if (n.includes("fonctions") || n.includes("scope") || n.includes("closure") || (n.includes("js") && n.includes("fonction"))) return "js-functions";
  if (n.includes("javascript") || n.includes("js —") || n.includes("variable") || n.includes("type")) return "javascript";

  // ── React ──
  if (n.includes("react") && (n.includes("hook") || n.includes("usestate") || n.includes("useeffect") || n.includes("usememo"))) return "react-hooks";
  if (n.includes("react") && (n.includes("state") || n.includes("props") || n.includes("context"))) return "react-state";
  if (n.includes("react") || n.includes("jsx") || n.includes("composant")) return "react";
  if (n.includes("crud") && (n.includes("react") || n.includes("node"))) return "react";

  // ── Vue.js / TypeScript ──
  if (n.includes("vue.js") || n.includes("vuejs") || n.includes("vue —")) return "vuejs";
  if (n.includes("typescript") || n.includes("types &") || n.includes("interface")) return "typescript";

  // ── Node.js / Express ──
  if ((n.includes("node") || n.includes("npm")) && (n.includes("module") || n.includes("npm"))) return "nodejs-modules";
  if (n.includes("node") || n.includes("npm") || n.includes("express") || n.includes("variable d")) return "nodejs";

  // ── SQL & Data ──
  if (n.includes("jointure") || n.includes("join") || n.includes("inner") || n.includes("left") || n.includes("right")) return "sql-joins";
  if (n.includes("agrégation") || n.includes("group by") || n.includes("aggreg")) return "sql-aggregations";
  if (n.includes("sous-requête") || n.includes("transaction") || n.includes("acid") || n.includes("index") || n.includes("fenêtre") || n.includes("over") || n.includes("normalisation") || n.includes("modélisation")) return "sql-advanced";
  if (n.includes("sql") || n.includes("requête") || n.includes("select") || n.includes("filtres")) return "sql";

  // ── Git ──
  if (n.includes("git") && (n.includes("merge") || n.includes("rebase") || n.includes("conflit"))) return "git-advanced";
  if (n.includes("git") || n.includes("branche") || n.includes("commit")) return "git";
  if (n.includes("github actions") || n.includes("workflows") || n.includes("ci/cd") || n.includes("gitlab")) return "github-actions";

  // ── Docker / Kubernetes / Cloud ──
  if (n.includes("kubernetes") || n.includes("pods") || n.includes("k8s")) return "kubernetes";
  if (n.includes("docker") || n.includes("conteneur") || n.includes("compose")) return "docker";
  if (n.includes("aws") || n.includes("amazon")) return "aws";

  // ── Auth & Sécurité ──
  if (n.includes("jwt") || n.includes("authentification") || n.includes("oauth") || n.includes("hachage") || n.includes("cryptographie") || n.includes("sécuris")) return "jwt";

  // ── Bases de données NoSQL ──
  if (n.includes("mongodb") || n.includes("document") || n.includes("collection")) return "mongodb";
  if (n.includes("redis") || n.includes("cache") || n.includes("session")) return "redis";

  // ── GraphQL / WebSockets ──
  if (n.includes("graphql") || n.includes("schéma") || n.includes("resolver")) return "graphql";
  if (n.includes("websocket") || n.includes("socket") || n.includes("temps réel")) return "websockets";

  // ── Linux / Bash / SSH ──
  if (n.includes("bash") || n.includes("scripting") || n.includes("shell")) return "bash";
  if (n.includes("upload")) return "nodejs-modules";
  if (n.includes("linux") || n.includes("commande") || n.includes("fichiers") || n.includes("permission") || n.includes("ssh")) return "linux";

  // ── IA & ML ──
  if (n.includes("machine learning") || n.includes("apprentissage") || n.includes("ml") || n.includes("dataset") || n.includes("feature") || n.includes("régression") || n.includes("arbre") || n.includes("random forest") || n.includes("évaluation") || n.includes("métrique")) return "ml-concepts";
  if (n.includes("python") || n.includes("numpy") || n.includes("pandas") || n.includes("matplotlib") || n.includes("data science")) return "python-data";
  if (n.includes("llm") || n.includes("language model") || n.includes("transformer")) return "llm";
  if (n.includes("prompt") || n.includes("prompting")) return "prompt-eng";
  if (n.includes("rag") || n.includes("retrieval") || n.includes("augmented")) return "rag";

  // ── Frontend avancé ──
  if (n.includes("pwa") || n.includes("progressive web") || n.includes("service worker")) return "pwa";
  if (n.includes("test") || n.includes("jest") || n.includes("testing library")) return "testing";
  if (n.includes("performance") || n.includes("optimis") || n.includes("vite") || n.includes("webpack") || n.includes("build tool")) return "performance";
  if (n.includes("accessibilité") || n.includes("a11y") || n.includes("wcag")) return "accessibility";

  // ── Architecture Full Stack ──
  if (n.includes("microservice") || n.includes("monolithe")) return "monolith-microservices";
  if (n.includes("design pattern") || n.includes("pattern") || n.includes("mvc") || n.includes("api-first") || n.includes("architecture")) return "design-patterns";

  // ── ORM & Queues ──
  if (n.includes("orm") || n.includes("prisma") || n.includes("sequelize")) return "orm";
  if (n.includes("queue") || n.includes("worker") || n.includes("bull")) return "queues";

  // ── Paiement & Déploiement ──
  if (n.includes("stripe") || n.includes("paiement")) return "stripe";
  if (n.includes("hébergement") || n.includes("vercel") || n.includes("railway") || n.includes("ssl") || n.includes("domaine") || n.includes("certificat") || n.includes("déploiement") || n.includes("render")) return "hosting";

  return "generic";
}

// Détermine le niveau de difficulté selon la section de la roadmap
function getDifficultyFromSection(sectionTitle) {
  const t = (sectionTitle || "").toLowerCase();
  // Sections avancées → difficulté 3
  if (t.includes("avancé") || t.includes("frameworks") || t.includes("sécurité") || t.includes("llm") || t.includes("prompting") || t.includes("déploiement")) return 3;
  // Sections intermédiaires → difficulté 2
  if (t.includes("javascript") || t.includes("bases de données") || t.includes("conteneur") || t.includes("git") || t.includes("modèles") || t.includes("projet") || t.includes("ci/cd")) return 2;
  // Sections débutantes → difficulté 1
  return 1;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateMockSteps(levelName, sectionTitle) {
  const key = detectTopicKey(levelName);
  const topic = MOCK_DB[key] || MOCK_DB.generic;
  const difficulty = getDifficultyFromSection(sectionTitle);

  // Filtrer les questions selon la difficulté du niveau :
  // diff 1 → questions débutant seulement
  // diff 2 → débutant + intermédiaire
  // diff 3 → toutes les questions
  const filtered = topic.questions.filter(q => {
    if (!q.difficulty) return true; // compatibilité si pas de champ difficulty
    return q.difficulty <= difficulty;
  });

  // Si pas assez de questions filtrées, utiliser tout le pool
  const pool = filtered.length >= 3 ? filtered : topic.questions;

  return [
    { type: "theory", content: topic.theory },
    ...shuffle(pool).slice(0, 5).map(q => ({ type: "quiz", ...q })),
  ];
}

function userLevel(xp) {
  if (xp < 100) return { n:1, t:"Débutant", next:100 };
  if (xp < 300) return { n:2, t:"Apprenti", next:300 };
  if (xp < 600) return { n:3, t:"Intermédiaire", next:600 };
  if (xp < 1000) return { n:4, t:"Avancé", next:1000 };
  if (xp < 1500) return { n:5, t:"Expert", next:1500 };
  return { n:6, t:"Maître", next:2000 };
}

// ── Audio feedback (Web Audio API, aucun fichier externe) ────────────────────
function playBeep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.45);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      osc.frequency.setValueAtTime(200, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    }
  } catch(_) {}
}

// ── Daily Challenge (question du jour déterministe) ───────────────────────────
function getDailyChallenge() {
  const today = new Date().toISOString().slice(0, 10);
  const keys = Object.keys(MOCK_DB).filter(k => MOCK_DB[k].questions && MOCK_DB[k].questions.length >= 2);
  // Seed stable basé sur la date
  const seed = today.replace(/-/g, '').split('').reduce((a, c, i) => a + c.charCodeAt(0) * (i + 1), 0);
  const key  = keys[seed % keys.length];
  const pool = MOCK_DB[key].questions.filter(q => q.difficulty === 1 || q.difficulty === 2);
  const q    = pool[seed % pool.length] || MOCK_DB[key].questions[0];
  return { ...q, topicKey: key, date: today, theory: MOCK_DB[key].theory };
}

      utter.onend = () => setTtsPlaying(false);

  function buildLessonPrompt(lvName, rmName, langCode) {
    const langName = LANG_NAMES[langCode] || 'français';
    return `Génère une leçon de programmation en ${langName} sur "${lvName}" (cours: ${rmName}).
Règles: 1) UN bloc théorie (concepts clés, concis). 2) EXACTEMENT 4 questions quiz testant UNIQUEMENT ce qui est dans la théorie ci-dessus — aucune question ne peut porter sur un concept absent de la théorie. 3) 4 choix par question, index correct varié. 4) Tout en ${langName}.
JSON uniquement sans markdown: [{"type":"theory","content":"..."},{"type":"quiz","q":"...","answers":["A","B","C","D"],"correct":1,"explanation":"..."},...]`;
  }

  async function startLesson(rmId, secIdx, lvlIdx) {
    setCurRM(rmId); setCurSecIdx(secIdx); setCurLvlIdx(lvlIdx);
    setSteps([]); setStepIdx(0); setLives(3); setCorrect(0);
    setAnswered(false); setSelectedAns(null); setError(null);
    setShowErrorReview(false); setConfetti(false);
    wrongAnswersRef.current = [];

    const rm = ROADMAPS.find(r => r.id === rmId);
    const lv = rm.sections[secIdx].levels[lvlIdx];
    if (!geminiKey && !apiKey) {
      setNeedsApiKey(true);
      setLoading(false);
      setScreen("lesson");
      return;
    }
    setNeedsApiKey(false);
    setLoading(true);
    setScreen("lesson");

    // ── Cache des leçons (économie de quota) ─────────────────────────────────
    const cacheKey = `rl_lc_${rmId}_${secIdx}_${lvlIdx}_${lang}`;
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
      if (cached && cached.ts && Date.now() - cached.ts < 7 * 24 * 3600 * 1000) {
        setSteps(cached.steps); setLoading(false); return;
      }
    } catch(_) {}

    try {
      let text = "";
      if (geminiKey) {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiKey}`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ contents:[{ parts:[{ text: buildLessonPrompt(lv.name, rm.name, lang) }] }], generationConfig:{ maxOutputTokens:700 } }),
        });
        if (resp.ok) { const data = await resp.json(); text = data.candidates?.[0]?.content?.parts?.[0]?.text || ""; }
      } else {
        const resp = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{ "Content-Type":"application/json", "x-api-key":apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
          body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:700, messages:[{ role:"user", content:buildLessonPrompt(lv.name, rm.name, lang) }] }),
        });
        if (resp.ok) { const data = await resp.json(); text = (data.content||[]).map(i=>i.text||"").join(""); }
      }
      if (text) {
        let clean = text.replace(/```json\s*/g,"").replace(/```/g,"").trim();
        const si = clean.indexOf("["), ei = clean.lastIndexOf("]");
        if (si !== -1) {
          clean = ei > si ? clean.slice(si, ei+1) : clean.slice(si);
          const parsed = JSON.parse(clean);
          if (Array.isArray(parsed) && parsed.length > 0) {
            try { localStorage.setItem(cacheKey, JSON.stringify({ steps: parsed, ts: Date.now() })); } catch(_) {}
            setSteps(parsed); setLoading(false); return;
          }
        }
      }
    } catch(_) {
      setError((L_LESSON[lang]||L_LESSON.fr).error || "Erreur de génération");
      setLoading(false);
      return;
    }
    setError((L_LESSON[lang]||L_LESSON.fr).error || "Erreur de génération");
    setLoading(false);
  }

  function handleAnswer(idx) {
    if (answered) return;
    const step = steps[stepIdx];
    setSelectedAns(idx); setAnswered(true);
    if (idx === step.correct) {
      setCorrect(c => c + 1);
      playBeep('correct');
    } else {
      setLives(l => Math.max(0, l - 1));
      playBeep('wrong');
      wrongAnswersRef.current = [...wrongAnswersRef.current, { ...step, chosen: idx }];
    }
  }

  function nextStep() {
    if (lives === 0) { endLesson(true); return; }
    if (stepIdx+1 >= steps.length) { endLesson(false); return; }
    setStepIdx(i => i+1); setAnswered(false); setSelectedAns(null);
  }

  function endLesson(failed) {
    const rm = ROADMAPS.find(r => r.id === curRM);
    const lv = rm.sections[curSecIdx].levels[curLvlIdx];
    const quizCount = steps.filter(s => s.type !== "theory").length;
    const acc = quizCount ? Math.round((correct/quizCount)*100) : 100;
    const perfect = acc === 100 && !failed;
    const masteryWarn = !failed && !perfect && acc < 70; // Mastery Gate : suggérer de rejouer
    const xpGain = failed ? Math.round(lv.xp*0.2) : perfect ? lv.xp : Math.round(lv.xp*0.7);
    const today = new Date().toISOString().slice(0, 10);
    setState(s => {
      const newDone = { ...s.done };
      let newLvlDone = s.lvlDone;
      let newReplayed = s.replayed || 0;
      if (!failed) {
        const fi = getLevelIdx(curRM, curSecIdx, curLvlIdx);
        if (!newDone[curRM]) newDone[curRM] = [];
        if (!newDone[curRM].includes(fi)) {
          newDone[curRM] = [...newDone[curRM], fi];
          newLvlDone += 1;
        } else {
          newReplayed += 1; // rejoué un niveau déjà fait
        }
      }
      const newDates = [...new Set([...(s.sessionDates||[]), today])].slice(-90);
      const newBestStreak = Math.max(s.bestStreak || 1, s.streak || 1);
      return {
        ...s,
        xp: s.xp + xpGain,
        lvlDone: newLvlDone,
        done: newDone,
        perfectQuiz: perfect ? s.perfectQuiz + 1 : s.perfectQuiz,
        sessionDates: newDates,
        bestStreak: newBestStreak,
        replayed: newReplayed,
      };
    });
    if (perfect) setTimeout(() => setConfetti(true), 200);
    setResultData({
      failed, perfect, masteryWarn, xpGain,
      score: correct, total: quizCount, acc, livesLeft: lives,
      wrongAnswers: wrongAnswersRef.current,
      levelName: lv.name,
    });
    setScreen("result");
  }

            <div style={{height:6, background: dark?'#1e3a8a':'#dbeafe', borderRadius:99, overflow:'hidden'}}>
              <div className="progress-bar" style={{height:'100%', borderRadius:99, background:'linear-gradient(90deg,#3b82f6,#6366f1)', width:`${xpPct}%`}}/>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, color: dark?'#93c5fd':'#3b82f6', marginTop:4, fontWeight:500}}>
              <span>{state.xp} XP</span><span>{ul.next} XP → niv. {ul.n+1}</span>
            </div>
          </div>
        </div>

        {/* Streak milestone banner */}
        {[7,14,30,60,100].includes(state.streak) && (
          <div className="slide-up" style={{margin:'0 16px 10px', padding:'10px 14px', borderRadius:14,
            background:'linear-gradient(135deg,#f59e0b,#ef4444)',
            display:'flex', alignItems:'center', gap:10}}>
            <span style={{fontSize:24}}>🔥</span>
            <div>
              <div style={{fontSize:13, fontWeight:700, color:'white'}}>{state.streak} jours de série !</div>
              <div style={{fontSize:11, color:'rgba(255,255,255,0.85)'}}>Incroyable — tu es vraiment assidu{state.streak>=30?' 🏆':' ⭐'}</div>
            </div>
          </div>
        )}

        {/* Stats */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, padding:'0 16px', marginBottom:16}}>
          {[{v:state.xp,l:"XP totaux",icon:'⚡'},{v:state.lvlDone,l:"Niveaux",icon:'✅'},{v:`${state.streak}`,l:"Jours",icon:'🔥'}].map((s,i)=>(
            <div key={i} style={{
              background: dark?'#161616':'#f9fafb',
              border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`,
              borderRadius:14, padding:'10px 6px', textAlign:'center'
            }}>
              <div style={{fontSize:18, marginBottom:2}}>{s.icon}</div>
              <div style={{fontSize:17, fontWeight:700, color: dark?'#f9fafb':'#111827'}}>{s.v}</div>
              <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* ── Reprendre (prochain niveau débloqué) ──────────────────────── */}
        {(() => {
          let next = null;
          for (const rm of ROADMAPS) {
            if (next) break;
            for (let si = 0; si < rm.sections.length && !next; si++) {
              for (let li = 0; li < rm.sections[si].levels.length && !next; li++) {
                if (!isDone(rm.id,si,li) && isUnlocked(rm.id,si,li))
                  next = { rm, si, li, lv: rm.sections[si].levels[li] };
              }
            }
          }
          if (!next) return null;
          return (
            <div style={{padding:'0 16px', marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', marginBottom:8}}>{t.home?.resume||'REPRENDRE'}</div>
              <button onClick={()=>startLesson(next.rm.id,next.si,next.li)}
                style={{width:'100%', display:'flex', alignItems:'center', gap:12,
                  padding:'13px 14px', borderRadius:16, border:'none', cursor:'pointer', textAlign:'left',
                  background:'linear-gradient(135deg,#3b82f6,#6366f1)',
                  boxShadow:'0 6px 20px rgba(99,102,241,0.28)'}}>
                <div style={{width:42,height:42,borderRadius:13,background:'rgba(255,255,255,0.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>
                  {next.rm.icon}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:'white',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{next.lv.name}</div>
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.75)'}}>{next.rm.name} · +{next.lv.xp} XP</div>
                </div>
                <ChevronRight size={18} style={{color:'rgba(255,255,255,0.8)',flexShrink:0}}/>
              </button>
            </div>
          );
        })()}

        {/* ── Daily Challenge ───────────────────────────────────────────── */}
        {(() => {
          const dc = getDailyChallenge();
          const today = new Date().toISOString().slice(0,10);
          const dcAlreadyDone = state.dailyChallenge && state.dailyChallenge.date === today && state.dailyChallenge.done;
          const letters = ["A","B","C","D"];
          return (
            <div style={{padding:'0 16px', marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', marginBottom:8}}>{t.home?.daily||'DÉFI DU JOUR'}</div>
              <div style={{borderRadius:16, padding:'14px',
                border:`1.5px solid ${dcAlreadyDone?(dark?'#059669':'#6ee7b7'):(dark?'#2a2a2a':'#e0e7ff')}`,
                background: dcAlreadyDone?(dark?'#064e3b':'#f0fdf4'):(dark?'#161616':'#fafaff')}}>
                {dcAlreadyDone ? (
                  <div style={{textAlign:'center',padding:'6px 0'}}>
                    <div style={{fontSize:32,marginBottom:6}}>✅</div>
                    <div style={{fontSize:14,fontWeight:600,color:dark?'#34d399':'#059669'}}>{t.home?.dailyDone||'Défi du jour complété !'}</div>
                    <div style={{fontSize:12,color:dark?'#6b7280':'#9ca3af',marginTop:4}}>
                      {state.dailyChallenge.correct ? (t.home?.dailyCorrect||'+20 XP gagnés 🎉') : (t.home?.dailyWrong||'+5 XP · Reviens demain')}
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <span style={{fontSize:18}}>⚡</span>
                      <div style={{fontSize:13,fontWeight:700,color:dark?'#f9fafb':'#111827',flex:1}}>{t.home?.dailyQ||'Question du jour'}</div>
                      <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:99,background:'#eff6ff',color:'#1d4ed8'}}>+20 XP</span>
                    </div>
                    <div style={{fontSize:13,lineHeight:1.6,color:dark?'#d1d5db':'#374151',marginBottom:12}}>{dc.q}</div>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {(dc.answers||[]).map((a,i) => {
                        let cls = '';
                        if (dailyChallengeResult) {
                          if (i === dailyChallengeResult.correct) cls = 'dc-btn-correct';
                          else if (i === dailyChallengeResult.chosen) cls = 'dc-btn-wrong';
                          else cls = 'dc-btn-neutral';
                        }
                        return (
                          <button key={i} onClick={()=>handleDailyChallenge(dc,i)} disabled={!!dailyChallengeResult}
                            className={cls}
                            style={{padding:'9px 12px',borderRadius:12,fontSize:12,textAlign:'left',cursor:dailyChallengeResult?'default':'pointer',
                              border:`1.5px solid ${dark?'#2a2a2a':'#e5e7eb'}`,background:dark?'#0f0f0f':'white',color:dark?'#d1d5db':'#374151',
                              display:'flex',alignItems:'center',gap:8,transition:'all 0.2s'}}>
                            <span style={{width:20,height:20,borderRadius:'50%',background:dark?'#2a2a2a':'#e5e7eb',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0,color:dark?'#9ca3af':'#6b7280'}}>
                              {letters[i]}
                            </span>
                            <span>{a}</span>
                          </button>
                        );
                      })}
                    </div>
                    {dailyChallengeResult && (
                      <div className="slide-up" style={{marginTop:10,padding:'10px 12px',borderRadius:12,fontSize:12,lineHeight:1.6,
                        background:dailyChallengeResult.isCorrect?(dark?'#064e3b':'#f0fdf4'):(dark?'#450a0a':'#fff1f2'),
                        border:`1px solid ${dailyChallengeResult.isCorrect?(dark?'#059669':'#6ee7b7'):(dark?'#b91c1c':'#fca5a5')}`,
                        color:dailyChallengeResult.isCorrect?(dark?'#a7f3d0':'#065f46'):(dark?'#fca5a5':'#9f1239')}}>
                        <strong>{dailyChallengeResult.isCorrect?(t.home?.ok||'✅ Bonne réponse ! +20 XP'):(t.home?.nok||'❌ Pas tout à fait… +5 XP')}</strong>
                        <div style={{marginTop:4,opacity:0.9}}>{dailyChallengeResult.explanation}</div>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          );
        })()}

        {/* Roadmaps */}
        <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', padding:'0 16px', marginBottom:8}}>
          ROADMAPS DISPONIBLES
        </div>
        <div style={{padding:'0 16px 20px', display:'flex', flexDirection:'column', gap:8}}>
          {ROADMAPS.map(rm => {
            let total = 0; rm.sections.forEach(s => total += s.levels.length);
            const done = (state.done[rm.id]||[]).length;
            const pct = total ? Math.round((done/total)*100) : 0;
            const progColors = {frontend:'#3b82f6',backend:'#10b981',devops:'#f59e0b',ai:'#8b5cf6',fullstack:'#ec4899',sql:'#78716c'};
            const prog = progColors[rm.id] || '#3b82f6';
            return (
              <button key={rm.id} onClick={()=>{setCurRM(rm.id);setScreen("levels");}}
                className="card-hover"
                style={{
                  width:'100%', background: dark?'#161616':'#ffffff',
                  border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`,
                  borderRadius:16, padding:'12px 14px',
                  display:'flex', alignItems:'center', gap:12,
                  textAlign:'left', cursor:'pointer', boxShadow: dark?'none':'0 1px 4px rgba(0,0,0,0.04)'
                }}>
                <div style={{
                  width:44, height:44, borderRadius:14, flexShrink:0,
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:22,
                  background: dark?'#0f0f0f':'#f9fafb',
                  border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`
                }}>{rm.icon}</div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
                    <span style={{fontSize:14, fontWeight:600, color: dark?'#f9fafb':'#111827', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{rm.name}</span>
                    {rm.badge && <span style={{fontSize:10, fontWeight:600, padding:'2px 7px', borderRadius:99, background:'#eff6ff', color:'#1d4ed8'}}>{rm.badge}</span>}
                  </div>
                  <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', marginBottom:5}}>{done}/{total} niveaux</div>
                  <div style={{height:4, background: dark?'#2a2a2a':'#f3f4f6', borderRadius:99, overflow:'hidden'}}>
                    <div className="progress-bar" style={{height:'100%', borderRadius:99, background:prog, width:`${pct}%`}}/>
                  </div>
                </div>
                <ChevronRight size={16} style={{color: dark?'#4b5563':'#d1d5db', flexShrink:0}}/>
              </button>
            );
          })}
        </div>
      </div>
      <BottomNav active="home"/>
    </PhoneFrame>
  );

  // ── Classement ────────────────────────────────────────────────────────────
  if (screen === "lb") {
    const lb = LB_INIT.map(u => u.isYou ? {...u, xp:state.xp, n:username, av:avatarLetter} : u);
    const sorted = [...lb].sort((a,b)=>b.xp-a.xp);
    const rankEmoji = ["🥇","🥈","🥉"];
    const rankBg = ['linear-gradient(135deg,#fef3c7,#fde68a)','linear-gradient(135deg,#f3f4f6,#e5e7eb)','linear-gradient(135deg,#fed7aa,#fdba74)'];
    return (
      <PhoneFrame>
        <div style={{padding:'12px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0}}>
          <div style={{fontSize:18, fontWeight:700, color: dark?'#f9fafb':'#111827'}}>🏆 Classement</div>
          <ThemeToggle/>
        </div>
        <div style={{flex:1, overflowY:'auto', padding:'0 16px 16px'}}>
          {sorted.map((u,i) => (
            <div key={i} style={{
              display:'flex', alignItems:'center', gap:10,
              padding:'10px 12px', borderRadius:14, marginBottom:6,
              background: u.isYou ? (dark?'#1e3a5f':'#eff6ff') : (dark?'#161616':'#f9fafb'),
              border:`1px solid ${u.isYou?(dark?'#1e40af':'#bfdbfe'):(dark?'#2a2a2a':'#f3f4f6')}`,
              transition:'all 0.15s'
            }}>
              <div style={{width:28, textAlign:'center', fontSize:i<3?18:13, fontWeight:600, color: dark?'#9ca3af':'#6b7280'}}>
                {i < 3 ? rankEmoji[i] : i+1}
              </div>
              <div style={{
                width:34, height:34, borderRadius:'50%', flexShrink:0,
                background: i<3 ? rankBg[i] : (dark?'#2a2a2a':'#e5e7eb'),
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:13, fontWeight:700, color: dark?'#0f0f0f':'#374151'
              }}>{u.av}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14, fontWeight:u.isYou?600:500, color: dark?'#f9fafb':'#111827'}}>{u.n}</div>
                {u.isYou && <div style={{fontSize:11, color:'#3b82f6', fontWeight:600}}>• Toi</div>}
              </div>
              <div style={{fontSize:12, fontWeight:700, color: dark?'#60a5fa':'#1d4ed8'}}>{u.xp} XP</div>
            </div>
          ))}
        </div>
        <BottomNav active="lb"/>
      </PhoneFrame>
    );
  }

  // ── Badges ────────────────────────────────────────────────────────────────
  if (screen === "badges") {
    const earnedCount = BADGES.filter(b=>b.check(state)).length;
    return (
      <PhoneFrame>
        <div style={{padding:'12px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0}}>
          <div>
            <div style={{fontSize:18, fontWeight:700, color: dark?'#f9fafb':'#111827'}}>{(L_BADGES[lang]||L_BADGES.fr).title}</div>
            <div style={{fontSize:12, color: dark?'#6b7280':'#9ca3af', fontWeight:500}}>
              {earnedCount}/{BADGES.length} {(L_BADGES[lang]||L_BADGES.fr).count}
            </div>
          </div>
          <ThemeToggle/>
        </div>
        <div style={{flex:1, overflowY:'auto'}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, padding:'4px 16px 20px'}}>
            {BADGES.map((b,i)=>{
              const ok = b.check(state);
              return (
                <div key={i} className={ok?'bounce-in':''} style={{
                  border:`1.5px solid ${ok?(dark?'#059669':'#6ee7b7'):(dark?'#2a2a2a':'#f3f4f6')}`,
                  borderRadius:16, padding:'14px 10px', textAlign:'center',
                  background: ok?(dark?'#064e3b':'#f0fdf4'):(dark?'#161616':'#f9fafb'),
                  opacity: ok?1:0.45,
                  transition:'all 0.2s'
                }}>
                  <div style={{fontSize:32, marginBottom:8}}>{b.icon}</div>
                  <div style={{fontSize:13, fontWeight:600, color: dark?'#f9fafb':'#111827', marginBottom:3}}>{b.name}</div>
                  <div style={{fontSize:11, color: dark?'#9ca3af':'#6b7280', lineHeight:1.4}}>{b.desc}</div>
                  {ok && <div style={{fontSize:11, color: dark?'#34d399':'#059669', fontWeight:600, marginTop:8, display:'flex', alignItems:'center', justifyContent:'center', gap:3}}>
                    <Check size={11}/>{(L_BADGES[lang]||L_BADGES.fr).unlocked}
                  </div>}
                </div>
              );
            })}
          </div>
        </div>
        <BottomNav active="badges"/>
      </PhoneFrame>
    );
  }

  // ── Profil ────────────────────────────────────────────────────────────────
  if (screen === "profile") return (
    <PhoneFrame>
      <div style={{padding:'12px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0}}>
        <div style={{fontSize:18, fontWeight:700, color: dark?'#f9fafb':'#111827'}}>{(L_PROFILE[lang]||L_PROFILE.fr).title}</div>
        <ThemeToggle/>
      </div>
      <div style={{flex:1, overflowY:'auto'}}>
        {/* Avatar + nom */}
        <div style={{padding:'8px 16px 16px', textAlign:'center'}}>
          <div style={{
            width:68, height:68, borderRadius:'50%', margin:'0 auto 12px',
            background:'linear-gradient(135deg,#3b82f6,#6366f1)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:26, fontWeight:700, color:'white',
            boxShadow:'0 8px 24px rgba(99,102,241,0.35)'
          }}>{avatarLetter}</div>
          {editingUsername ? (
            <div style={{display:'flex', alignItems:'center', gap:8, justifyContent:'center', marginTop:4}}>
              <input type="text" value={usernameInput}
                onChange={e=>setUsernameInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&saveUsername()} autoFocus
                style={{
                  border:`1.5px solid #3b82f6`, borderRadius:10, padding:'6px 12px',
                  fontSize:14, textAlign:'center', width:140,
                  background: dark?'#161616':'white', color: dark?'#f9fafb':'#111827'
                }}/>
              <button onClick={saveUsername} style={{color:'#10b981'}}><Check size={16}/></button>
              <button onClick={()=>{setEditingUsername(false);setUsernameInput(username);}} style={{color: dark?'#6b7280':'#9ca3af'}}><X size={16}/></button>
            </div>
          ) : (
            <div style={{display:'flex', alignItems:'center', gap:6, justifyContent:'center'}}>
              <span style={{fontSize:16, fontWeight:600, color: dark?'#f9fafb':'#111827'}}>{username}</span>
              <button onClick={()=>{setEditingUsername(true);setUsernameInput(username);}} style={{color: dark?'#6b7280':'#9ca3af', padding:2}}><Edit2 size={13}/></button>
            </div>
          )}
          <div style={{fontSize:12, color: dark?'#6b7280':'#9ca3af', marginTop:4, fontWeight:500}}>{(L_PROFILE[lang]||L_PROFILE.fr).level} {ul.n} · {ul.t}</div>
        </div>

        {/* Stats */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, padding:'0 16px', marginBottom:16}}>
          {[{v:state.xp,l:"XP"},{v:state.lvlDone,l:(L_PROFILE[lang]||L_PROFILE.fr).levels},{v:Object.keys(state.done).filter(k=>(state.done[k]||[]).length>0).length,l:(L_PROFILE[lang]||L_PROFILE.fr).roadmaps}].map((s,i)=>(
            <div key={i} style={{background: dark?'#161616':'#f9fafb', border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`, borderRadius:14, padding:'10px 6px', textAlign:'center'}}>
              <div style={{fontSize:18, fontWeight:700, color: dark?'#f9fafb':'#111827'}}>{s.v}</div>
              <div style={{fontSize:11, color: dark?'#6b7280':'#9ca3af', marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* Progression */}
        <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', padding:'0 16px', marginBottom:8}}>{(L_PROFILE[lang]||L_PROFILE.fr).progression}</div>
        <div style={{padding:'0 16px', marginBottom:16}}>
          {ROADMAPS.map((rm,ri)=>{
            let total=0; rm.sections.forEach(s=>total+=s.levels.length);
            const done=(state.done[rm.id]||[]).length;
            const pct=total?Math.round((done/total)*100):0;
            const progColors = {frontend:'#3b82f6',backend:'#10b981',devops:'#f59e0b',ai:'#8b5cf6',fullstack:'#ec4899',sql:'#78716c'};
            return (
              <div key={rm.id} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:`1px solid ${dark?'#161616':'#f9fafb'}`}}>
                <span style={{fontSize:18}}>{rm.icon}</span>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', justifyContent:'space-between', marginBottom:4}}>
                    <span style={{fontSize:13, fontWeight:500, color: dark?'#f9fafb':'#111827'}}>{rm.name}</span>
                    <span style={{fontSize:11, color: dark?'#6b7280':'#9ca3af'}}>{done}/{total}</span>
                  </div>
                  <div style={{height:4, background: dark?'#2a2a2a':'#f3f4f6', borderRadius:99, overflow:'hidden'}}>
                    <div className="progress-bar" style={{height:'100%', borderRadius:99, background:progColors[rm.id]||'#3b82f6', width:`${pct}%`}}/>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* ── Heatmap activité (60 derniers jours) ─────────────────────── */}
        <div style={{fontSize:11, fontWeight:700, color: dark?'#6b7280':'#9ca3af', letterSpacing:'0.08em', padding:'0 16px', marginBottom:8}}>{t.home?.activity||'ACTIVITÉ'}</div>
        <div style={{margin:'0 16px', marginBottom:20, padding:'14px', borderRadius:16, background:dark?'#161616':'#f9fafb', border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`}}>
          {/* Record de série */}
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:12}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:dark?'#f9fafb':'#111827'}}>{state.streak || 1}🔥</div>
              <div style={{fontSize:11, color:dark?'#6b7280':'#9ca3af'}}>{t.home?.streakCurrent||'Série actuelle'}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:dark?'#f9fafb':'#111827'}}>{state.bestStreak || 1}🏅</div>
              <div style={{fontSize:11, color:dark?'#6b7280':'#9ca3af'}}>{t.home?.streakBest||'Meilleure série'}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:dark?'#f9fafb':'#111827'}}>{(state.sessionDates||[]).length}</div>
              <div style={{fontSize:11, color:dark?'#6b7280':'#9ca3af'}}>{t.home?.activeDays||'Jours actifs'}</div>
            </div>
          </div>
          {/* Grille 60 jours */}
          <div style={{display:'flex', flexWrap:'wrap', gap:3}}>
            {Array.from({length:60}, (_,i) => {
              const d = new Date();
              d.setDate(d.getDate() - (59 - i));
              const key = d.toISOString().slice(0,10);
              const active = (state.sessionDates||[]).includes(key);
              const isToday = key === new Date().toISOString().slice(0,10);
              return (
                <div key={i} className="hm-dot"
                  title={key}
                  style={{
                    background: active?(dark?'#3b82f6':'#3b82f6'):(dark?'#2a2a2a':'#e5e7eb'),
                    opacity: active ? 1 : 0.5,
                    outline: isToday ? `2px solid ${dark?'#60a5fa':'#1d4ed8'}` : 'none',
                    outlineOffset: '1px',
                  }}/>
              );
            })}
          </div>

        <div style={{margin:'0 16px', padding:'12px 14px', borderRadius:14, border:`1px solid ${dark?'#2a2a2a':'#f3f4f6'}`, marginBottom:20, background: dark?'#161616':'#f9fafb'}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6}}>
            <div style={{display:'flex', alignItems:'center', gap:6, fontSize:13, fontWeight:500, color: dark?'#d1d5db':'#374151'}}>
              <Key size={13} style={{color: dark?'#6b7280':'#9ca3af'}}/>{(L_PROFILE[lang]||L_PROFILE.fr).apiLabel}

            <button onClick={()=>{setEditingApiKey(v=>!v);setApiKeyInput(apiKey);setShowApiKey(false);}} style={{fontSize:12, fontWeight:600, color:'#3b82f6', background:'none', border:'none', cursor:'pointer'}}>
